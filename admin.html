<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool & Beach | Administración</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #e0f2fe;
      color: #0f172a;
    }
    body {
      min-height: 100vh;
    }
    .oculto {
      display: none !important;
    }
    /* ==============================
       LOGIN
       ============================== */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
    }
    .logo {
      text-align: center;
      margin-bottom: 25px;
    }
    .logo h1 {
      margin: 0;
      color: #0284c7;
      font-size: 30px;
    }
    .logo p {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 15px;
    }
    .campo {
      margin-bottom: 18px;
    }
    .campo label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-weight: bold;
    }
    .campo input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      color: #0f172a;
      font-size: 16px;
      outline: none;
    }
    .campo input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }
    #loginButton {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    #loginButton:hover {
      background: #0369a1;
    }
    #loginButton:disabled {
      opacity: 0.65;
      cursor: wait;
    }
    #mensaje {
      margin-top: 15px;
      min-height: 20px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }
    #mensaje.error {
      background: #fee2e2;
      color: #991b1b;
    }
    #mensaje.ok {
      background: #dcfce7;
      color: #166534;
    }
    /* ==============================
       PANEL
       ============================== */
    #adminScreen {
      min-height: 100vh;
      background: #f1f5f9;
    }
    .barra {
      background: #0284c7;
      color: white;
      padding: 18px 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }
    .barra-contenido {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .barra h1 {
      margin: 0;
      font-size: 24px;
    }
    .barra p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    #logoutButton {
      width: auto;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: #dc2626;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    .contenido {
      max-width: 1200px;
      margin: 0 auto;
      padding: 25px 20px;
    }
    .bienvenida {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.08);
    }
    .bienvenida h2 {
      margin: 0 0 8px;
      color: #0284c7;
    }
    .bienvenida p {
      color: #64748b;
    }
    .tarjetas {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 22px;
    }
    .tarjeta {
      background: #ffffff;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.08);
    }
    .tarjeta-titulo {
      color: #64748b;
      font-size: 14px;
    }
    .tarjeta-numero {
      margin-top: 8px;
      color: #0284c7;
      font-size: 30px;
      font-weight: bold;
    }
    @media (max-width: 800px) {
      .tarjetas {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 500px) {
      .login-box {
        padding: 25px 20px;
      }
      .barra-contenido {
        align-items: flex-start;
      }
      .barra h1 {
        font-size: 20px;
      }
      .tarjetas {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .tarjeta {
        padding: 15px;
      }
      .tarjeta-numero {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <!-- ==================================
       PANTALLA DE INICIO DE SESIÓN
       ================================== -->
  <div id="loginScreen">
    <div class="login-box">
      <div class="logo">
        <h1>🏖️ Pool & Beach</h1>
        <p>Panel de administración</p>
      </div>
      <form id="loginForm">
        <div class="campo">
          <label for="email">
            Correo electrónico
          </label>
          <input
            id="email"
            type="email"
            placeholder="Ingresá tu correo"
            autocomplete="username"
            required
          >
        </div>
        <div class="campo">
          <label for="password">
            Contraseña
          </label>
          <input
            id="password"
            type="password"
            placeholder="Ingresá tu contraseña"
            autocomplete="current-password"
            required
          >
        </div>
        <button
          id="loginButton"
          type="submit"
        >
          Iniciar sesión
        </button>
        <div id="mensaje"></div>
      </form>
    </div>
  </div>
  <!-- ==================================
       PANEL DE ADMINISTRACIÓN
       ================================== -->
  <div
    id="adminScreen"
    class="oculto"
  >
    <header class="barra">
      <div class="barra-contenido">
        <div>
          <h1>🏖️ Pool & Beach</h1>
          <p>Panel de administración</p>
        </div>
        <button
          id="logoutButton"
          type="button"
        >
          Cerrar sesión
        </button>
      </div>
    </header>
    <main class="contenido">
      <section class="bienvenida">
        <h2>
          ¡Bienvenida al panel! 👋
        </h2>
        <p>
          El inicio de sesión fue realizado correctamente.
        </p>
        <div class="tarjetas">
          <div class="tarjeta">
            <div class="tarjeta-titulo">
              Reservas
            </div>
            <div
              id="reservasCount"
              class="tarjeta-numero"
            >
              0
            </div>
          </div>
          <div class="tarjeta">
            <div class="tarjeta-titulo">
              Mesas
            </div>
            <div
              id="mesasCount"
              class="tarjeta-numero"
            >
              0
            </div>
          </div>
          <div class="tarjeta">
            <div class="tarjeta-titulo">
              Fotos
            </div>
            <div
              id="fotosCount"
              class="tarjeta-numero"
            >
              0
            </div>
          </div>
          <div class="tarjeta">
            <div class="tarjeta-titulo">
              Estado
            </div>
            <div
              class="tarjeta-numero"
              style="font-size:22px;"
            >
              ACTIVO
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script>
    /* ==================================
       CONFIGURACIÓN SUPABASE
       ================================== */
    const SUPABASE_URL =
      "https://nmpakeovqkdajtswjpgm.supabase.co";
    const SUPABASE_ANON_KEY =
      "sb_publishable_FyuFdiW_2eXNScLd9MShng_rLxxztsu";
    /* ==================================
       CLIENTE SUPABASE
       ================================== */
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false
          }
        }
      );
    /* ==================================
       ELEMENTOS
       ================================== */
    const loginScreen =
      document.getElementById("loginScreen");
    const adminScreen =
      document.getElementById("adminScreen");
    const loginForm =
      document.getElementById("loginForm");
    const loginButton =
      document.getElementById("loginButton");
    const logoutButton =
      document.getElementById("logoutButton");
    const mensajeElemento =
      document.getElementById("mensaje");
    /* ==================================
       MOSTRAR MENSAJE
       ================================== */
    function mostrarMensaje(texto, tipo) {
      mensajeElemento.textContent = texto;
      mensajeElemento.className = tipo || "";
    }
    /* ==================================
       MOSTRAR PANEL
       ================================== */
    function mostrarPanel() {
      loginScreen.classList.add("oculto");
      adminScreen.classList.remove("oculto");
      cargarContadores();
    }
    /* ==================================
       MOSTRAR LOGIN
       ================================== */
    function mostrarLogin() {
      adminScreen.classList.add("oculto");
      loginScreen.classList.remove("oculto");
    }
    /* ==================================
       INICIO DE SESIÓN
       ================================== */
    loginForm.addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();
        event.stopPropagation();
        const email =
          document
            .getElementById("email")
            .value
            .trim();
        const password =
          document
            .getElementById("password")
            .value;
        if (!email || !password) {
          mostrarMensaje(
            "Ingresá el correo y la contraseña.",
            "error"
          );
          return;
        }
        loginButton.disabled = true;
        loginButton.textContent =
          "Ingresando...";
        mostrarMensaje("", "");
        try {
          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });
          if (error) {
            console.error(
              "Supabase:",
              error
            );
            mostrarMensaje(
              error.message,
              "error"
            );
            return;
          }
          if (
            data &&
            data.session
          ) {
            /*
             * SESIÓN CONFIRMADA.
             * No hacemos ninguna redirección.
             * Mostramos directamente el panel.
             */
            mostrarMensaje(
              "Inicio de sesión correcto.",
              "ok"
            );
            mostrarPanel();
          } else {
            mostrarMensaje(
              "Supabase no devolvió una sesión.",
              "error"
            );
          }
        } catch (error) {
          console.error(
            "Error:",
            error
          );
          mostrarMensaje(
            "Error de conexión con Supabase.",
            "error"
          );
        } finally {
          loginButton.disabled = false;
          loginButton.textContent =
            "Iniciar sesión";
        }
      }
    );
    /* ==================================
       CERRAR SESIÓN
       ================================== */
    logoutButton.addEventListener(
      "click",
      async function() {
        logoutButton.disabled = true;
        try {
          await supabaseClient.auth.signOut();
        } finally {
          logoutButton.disabled = false;
          document.getElementById(
            "password"
          ).value = "";
          mostrarLogin();
        }
      }
    );
    /* ==================================
       COMPROBAR SESIÓN AL ABRIR
       ================================== */
    async function comprobarSesion() {
      try {
        const {
          data
        } =
          await supabaseClient.auth.getSession();
        if (
          data &&
          data.session
        ) {
          mostrarPanel();
        } else {
          mostrarLogin();
        }
      } catch (error) {
        console.error(
          "Error comprobando sesión:",
          error
        );
        mostrarLogin();
      }
    }
    /* ==================================
       CONTADORES
       ================================== */
    async function cargarContadores() {
      try {
        const reservas =
          await supabaseClient
            .from("reservas")
            .select("*", {
              count: "exact",
              head: true
            });
        const mesas =
          await supabaseClient
            .from("mesas")
            .select("*", {
              count: "exact",
              head: true
            });
        const fotos =
          await supabaseClient
            .from("galeria_fotos")
            .select("*", {
              count: "exact",
              head: true
            });
        if (!reservas.error) {
          document.getElementById(
            "reservasCount"
          ).textContent =
            reservas.count || 0;
        }
        if (!mesas.error) {
          document.getElementById(
            "mesasCount"
          ).textContent =
            mesas.count || 0;
        }
        if (!fotos.error) {
          document.getElementById(
            "fotosCount"
          ).textContent =
            fotos.count || 0;
        }
      } catch (error) {
        console.error(
          "Error cargando contadores:",
          error
        );
      }
    }
    /* ==================================
       ARRANQUE
       ================================== */
    comprobarSesion();
  </script>
</body>
</html>
