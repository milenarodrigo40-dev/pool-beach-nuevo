<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control | Pool & Beach</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f9;
  color:#17202a;
}
header{
  background:#071d2b;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:24px;
}
header p{
  margin:6px 0 0;
  opacity:.8;
}
.container{
  width:min(1100px,94%);
  margin:20px auto;
}
.login{
  max-width:430px;
  margin:50px auto;
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}
input,
select,
textarea,
button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:9px;
  border:1px solid #ccd5db;
  font-size:15px;
}
textarea{
  min-height:90px;
  resize:vertical;
}
button{
  background:#087ea4;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
button:hover{
  opacity:.9;
}
button.danger{
  background:#d62828;
  width:auto;
  padding:9px 14px;
  margin:0;
}
button.secondary{
  background:#52616b;
}
.hidden{
  display:none!important;
}
.message{
  margin:10px 0;
  padding:12px;
  border-radius:9px;
  background:#dff6e9;
  color:#146c43;
}
.message.error{
  background:#ffe1e1;
  color:#a61b1b;
}
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}
nav button{
  width:auto;
  background:#0b3447;
  padding:10px 14px;
}
nav button.active{
  background:#087ea4;
}
.section{
  display:none;
}
.section.active{
  display:block;
}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}
.card h2{
  margin-top:0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:12px;
}
.record{
  border:1px solid #dce3e7;
  border-radius:12px;
  padding:15px;
  margin:10px 0;
  background:#fafcfd;
}
.record-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.record-title{
  font-size:17px;
  font-weight:bold;
}
.record p{
  margin:7px 0;
}
.empty{
  padding:20px;
  text-align:center;
  color:#6b7780;
}
.logout{
  background:#9b2226;
  width:auto;
  padding:10px 18px;
}
.small{
  font-size:13px;
  color:#667;
}
@media(max-width:600px){
  .record-header{
    flex-direction:column;
  }
  button.danger{
    width:100%;
  }
}
</style>
</head>
<body>
<header>
  <h1>Pool & Beach</h1>
  <p>Panel de Administración</p>
</header>
<div class="container">
  <!-- LOGIN -->
  <div id="loginBox" class="login">
    <h2>Iniciar sesión</h2>
    <input
      id="email"
      type="email"
      placeholder="Correo electrónico"
      autocomplete="email"
    >
    <input
      id="password"
      type="password"
      placeholder="Contraseña"
      autocomplete="current-password"
    >
    <button onclick="login()">INICIAR SESIÓN</button>
    <div id="loginMessage"></div>
  </div>
  <!-- PANEL -->
  <div id="panel" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px;">
      <strong>Panel de control</strong>
      <button class="logout" onclick="logout()">Cerrar sesión</button>
    </div>
    <nav>
      <button onclick="showSection('reservas',this)">Reservas</button>
      <button onclick="showSection('mesas',this)">Mesas</button>
      <button onclick="showSection('promociones',this)">Promociones</button>
      <button onclick="showSection('fotos',this)">Fotos</button>
      <button onclick="showSection('productos',this)">Productos</button>
      <button onclick="showSection('pedidos',this)">Pedidos</button>
      <button onclick="showSection('juegos',this)">Juegos</button>
      <button onclick="showSection('ranking',this)">Ranking</button>
      <button onclick="showSection('torneos',this)">Torneos</button>
    </nav>
    <div id="globalMessage"></div>
    <!-- RESERVAS -->
    <section id="reservas" class="section">
      <div class="card">
        <h2>Reservas</h2>
        <button onclick="loadReservas()">Actualizar reservas</button>
        <div id="reservasList"></div>
      </div>
    </section>
    <!-- MESAS -->
    <section id="mesas" class="section">
      <div class="card">
        <h2>Mesas</h2>
        <form onsubmit="createMesa(event)">
          <div class="grid">
            <input id="mesaNumero" type="number" placeholder="Número de mesa" required>
            <input id="mesaNombre" type="text" placeholder="Nombre de mesa">
            <input id="mesaServicio" type="text" placeholder="Servicio">
          </div>
          <button type="submit">Agregar mesa</button>
        </form>
        <hr>
        <div id="mesasList"></div>
      </div>
    </section>
    <!-- PROMOCIONES -->
    <section id="promociones" class="section">
      <div class="card">
        <h2>Promociones</h2>
        <form onsubmit="createPromocion(event)">
          <input id="promoTitulo" type="text" placeholder="Título" required>
          <textarea id="promoDescripcion" placeholder="Descripción"></textarea>
          <input id="promoPrecio" type="number" step="0.01" placeholder="Precio">
          <label>
            <input id="promoActiva" type="checkbox" checked style="width:auto;">
            Promoción activa
          </label>
          <button type="submit">Agregar promoción</button>
        </form>
        <hr>
        <div id="promocionesList"></div>
      </div>
    </section>
    <!-- FOTOS -->
    <section id="fotos" class="section">
      <div class="card">
        <h2>Fotos</h2>
        <form onsubmit="createFoto(event)">
          <input id="fotoTitulo" type="text" placeholder="Título" required>
          <input id="fotoCategoria" type="text" placeholder="Categoría">
          <input id="fotoRuta" type="text" placeholder="Ruta">
          <input id="fotoUrl" type="url" placeholder="URL de la imagen" required>
          <button type="submit">Agregar foto</button>
        </form>
        <hr>
        <div id="fotosList"></div>
      </div>
    </section>
    <!-- PRODUCTOS -->
    <section id="productos" class="section">
      <div class="card">
        <h2>Productos</h2>
        <form onsubmit="createProducto(event)">
          <input id="productoNombre" type="text" placeholder="Nombre" required>
          <input id="productoCategoria" type="text" placeholder="Categoría">
          <textarea id="productoDescripcion" placeholder="Descripción"></textarea>
          <input id="productoPrecio" type="number" step="0.01" placeholder="Precio">
          <label>
            <input id="productoDisponible" type="checkbox" checked style="width:auto;">
            Disponible
          </label>
          <button type="submit">Agregar producto</button>
        </form>
        <hr>
        <div id="productosList"></div>
      </div>
    </section>
    <!-- PEDIDOS -->
    <section id="pedidos" class="section">
      <div class="card">
        <h2>Pedidos</h2>
        <button onclick="loadPedidos()">Actualizar pedidos</button>
        <div id="pedidosList"></div>
      </div>
    </section>
    <!-- JUEGOS -->
    <section id="juegos" class="section">
      <div class="card">
        <h2>Juegos</h2>
        <form onsubmit="createJuego(event)">
          <input id="juegoNombre" type="text" placeholder="Nombre del juego" required>
          <textarea id="juegoDescripcion" placeholder="Descripción"></textarea>
          <input id="juegoIcono" type="text" placeholder="Icono">
          <input id="juegoPuntos" type="number" placeholder="Puntos">
          <input id="juegoTokens" type="number" placeholder="Tokens">
          <label>
            <input id="juegoActivo" type="checkbox" checked style="width:auto;">
            Juego activo
          </label>
          <button type="submit">Agregar juego</button>
        </form>
        <hr>
        <div id="juegosList"></div>
      </div>
    </section>
    <!-- RANKING -->
    <section id="ranking" class="section">
      <div class="card">
        <h2>Ranking</h2>
        <button onclick="loadRanking()">Actualizar ranking</button>
        <div id="rankingList"></div>
      </div>
    </section>
    <!-- TORNEOS -->
    <section id="torneos" class="section">
      <div class="card">
        <h2>Torneos</h2>
        <form onsubmit="createTorneo(event)">
          <input id="torneoNombre" type="text" placeholder="Nombre del torneo" required>
          <input id="torneoJuego" type="text" placeholder="Juego" required>
          <input id="torneoFecha" type="date">
          <input id="torneoInscripcion" type="number" step="0.01" placeholder="Inscripción">
          <input id="torneoPremio1" type="number" step="0.01" placeholder="Premio 1°">
          <input id="torneoPremio2" type="number" step="0.01" placeholder="Premio 2°">
          <input id="torneoMax" type="number" placeholder="Máximo de participantes">
          <input id="torneoEstado" type="text" placeholder="Estado" value="abierto">
          <textarea id="torneoNotas" placeholder="Notas"></textarea>
          <button type="submit">Agregar torneo</button>
        </form>
        <hr>
        <div id="torneosList"></div>
      </div>
    </section>
  </div>
</div>
<script>
const SUPABASE_URL = "https://nmpakeovqkdajtswjpgm.supabase.co";
const SUPABASE_KEY = "sb_publishable_FyuFdiW_2eXNScLd9MShng_rLxxztsu";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
/* =========================
   MENSAJES
========================= */
function showMessage(text,error=false){
  const box=document.getElementById("globalMessage");
  box.innerHTML=
    `<div class="message ${error ? "error" : ""}">
      ${escapeHtml(text)}
    </div>`;
  setTimeout(()=>{
    box.innerHTML="";
  },4000);
}
function showLoginMessage(text,error=false){
  const box=document.getElementById("loginMessage");
  box.innerHTML=
    `<div class="message ${error ? "error" : ""}">
      ${escapeHtml(text)}
    </div>`;
}
/* =========================
   SEGURIDAD HTML
========================= */
function escapeHtml(value){
  if(value===null || value===undefined){
    return "";
  }
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
/* =========================
   LOGIN
========================= */
async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!email || !password){
    showLoginMessage(
      "Completá correo y contraseña.",
      true
    );
    return;
  }
  const {data,error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });
  if(error){
    console.error(error);
    showLoginMessage(
      "No se pudo iniciar sesión: "+error.message,
      true
    );
    return;
  }
  showLoginMessage("Sesión iniciada correctamente.");
  setTimeout(()=>{
    showPanel();
  },300);
}
/* =========================
   SESIÓN
========================= */
async function showPanel(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  const firstButton=document.querySelector("nav button");
  showSection("reservas",firstButton);
  refreshAll();
}
async function logout(){
  await supabaseClient.auth.signOut();
  document.getElementById("panel").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}
/* =========================
   NAVEGACIÓN
========================= */
function showSection(id,button){
  document.querySelectorAll(".section")
    .forEach(section=>{
      section.classList.remove("active");
    });
  document.getElementById(id)
    .classList.add("active");
  document.querySelectorAll("nav button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
  if(button){
    button.classList.add("active");
  }
}
/* =========================
   ELIMINAR
========================= */
async function deleteRecord(table,id,nombre){
  const confirmar=confirm(
    `¿Seguro que querés eliminar "${nombre}"?\n\nEsta acción no se puede deshacer.`
  );
  if(!confirmar){
    return;
  }
  const {error}=await supabaseClient
    .from(table)
    .delete()
    .eq("id",id);
  if(error){
    console.error(
      "ERROR AL ELIMINAR:",
      table,
      id,
      error
    );
    showMessage(
      "No se pudo eliminar. El registro existe pero Supabase está bloqueando la eliminación. Hay que revisar los permisos RLS.",
      true
    );
    return;
  }
  showMessage("Registro eliminado correctamente.");
  refreshAll();
}
/* =========================
   ACTUALIZAR TODO
========================= */
function refreshAll(){
  loadReservas();
  loadMesas();
  loadPromociones();
  loadFotos();
  loadProductos();
  loadPedidos();
  loadJuegos();
  loadRanking();
  loadTorneos();
}
/* =========================
   RESERVAS
========================= */
async function loadReservas(){
  const box=document.getElementById("reservasList");
  box.innerHTML="Cargando...";
  const {data,error}=await supabaseClient
    .from("reservas")
    .select("*")
    .order("created_at",{ascending:false});
  if(error){
    box.innerHTML=
      `<div class="empty">No se pudieron cargar las reservas.</div>`;
    console.error(error);
    return;
  }
  if(!data.length){
    box.innerHTML=
      `<div class="empty">No hay reservas.</div>`;
    return;
  }
  box.innerHTML=data.map(r=>`
    <div class="record">
      <div class="record-header">
        <div>
          <div class="record-title">
            Reserva de ${escapeHtml(r.nombre)}
          </div>
          <p>📅 ${escapeHtml(r.fecha || "")}</p>
          <p>🕐 ${escapeHtml(r.hora || "")}</p>
          <p>👥 ${escapeHtml(r.cantidad_personas || "")} personas</p>
          <p>🎯 ${escapeHtml(r.servicio || "")}</p>
          <p>📞 ${escapeHtml(r.telefono || "")}</p>
          <p>Estado: ${escapeHtml(r.estado || "")}</p>
          ${
            r.notas
            ? `<p>📝 ${escapeHtml(r.notas)}</p>`
            : ""
          }
        </div>
        <button
          class="danger"
          onclick="deleteRecord('reservas',${r.id},'Reserva de ${escapeHtml(r.nombre)}')">
          ELIMINAR
        </button>
      </div>
    </div>
  `).join("");
}
/* =========================
   MESAS
========================= */
async function createMesa(event){
  event.preventDefault();
  const numero=document.getElementById("mesaNumero").value;
  const nombre=document.getElementById("mesaNombre").value;
  const servicio=document.getElementById("mesaServicio").value;
  const {error}=await supabaseClient
    .from("mesas")
    .insert({
      numero:Number(numero),
      nombre:nombre || `Mesa ${numero}`,
      servicio:servicio || null,
      activa:true
    });
  if(error){
    console.error(error);
    showMessage("No se pudo crear la mesa.",true);
    return;
  }
  event.target.reset();
  showMessage("Mesa creada correctamente.");
  loadMesas();
}
async function loadMesas(){
  const box=document.getElementById("mesasList");
  box.innerHTML="Cargando...";
  const {data,error}=await supabaseClient
    .from("mesas")
    .select("*")
    .order("numero");
  if(error){
    box.innerHTML=
      `<div class="empty">No se pudieron cargar las mesas.</div>`;
    console.error(error);
    return;
  }
  if(!data.length){
    box.innerHTML=
      `<div class="empty">No hay mesas.</div>`;
    return;
  }
  box.innerHTML=data.map(m=>`
    <div class="record">
      <div class="record-header">
        <div>
          <div class="record-title">
            Mesa ${escapeHtml(m.numero)}
          </div>
          <p>${escapeHtml(m.nombre || "")}</p>
          <p>Servicio: ${escapeHtml(m.servicio || "")}</p>
          <p>Estado: ${m.activa ? "Activa" : "Inactiva"}</p>
        </div>
        <button
          class="danger"
          onclick="deleteRecord('mesas',${m.id},'Mesa ${escapeHtml(m.numero)}')">
          ELIMINAR
        </button>
      </div>
    </div>
  `).join("");
}
/* =========================
   PROMOCIONES
========================= */
async function createPromocion(event){
  event.preventDefault();
  const titulo=document.getElementById("promoTitulo").value;
  const descripcion=document.getElementById("promoDescripcion").value;
  const precio=document.getElementById("promoPrecio").value;
  const activa=document.getElementById("promoActiva").checked;
  const {error}=await supabaseClient
    .from("promociones")
    .insert({
      titulo,
      descripcion:descripcion || null,
      precio:precio ? Number(precio) : null,
      activa
    });
  if(error){
    console.error(error);
    showMessage("No se pudo crear la promoción.",true);
    return;
  }
  event.target.reset();
  document.getElementById("promoActiva").checked=true;
  showMessage("Promoción creada correctamente.");
  loadPromociones();
}
async function loadPromociones(){
  const box=document.getElementById("promocionesList");
  box.innerHTML="Cargando...";
  const {data,error}=await supabaseClient
    .from("promociones")
    .select("*")
    .order("created_at",{ascending:false});
  if(error){
    box.innerHTML=
      `<div class="empty">No se pudieron cargar las promociones.</div>`;
    console.error(error);
    return;
  }
  if(!data.length){
    box.innerHTML=
      `<div class="empty">No hay promociones.</div>`;
    return;
  }
  box.innerHTML=data.map(p=>`
    <div class="record">
      <div class="record-header">
        <div>
          <div class="record-title">
            ${escapeHtml(p.titulo)}
          </div>
          <p>${escapeHtml(p.descripcion || "")}</p>
          ${
            p.precio !== null
            ? `<p>Precio: $${escapeHtml(p.precio)}</p>`
            : ""
          }
          <p>${p.activa ? "Activa" : "Inactiva"}</p>
        </div>
        <button
          class="danger"
          onclick="deleteRecord('promociones','${escapeHtml(p.id)}','${escapeHtml(p.titulo)}')">
          ELIMINAR
        </button>
      </div>
    </div>
  `).join("");
}
/* =========================
   FOTOS
========================= */
async function createFoto(event){
  event.preventDefault();
  const titulo=document.getElementById("fotoTitulo").value;
  const categoria=document.getElementById("fotoCategoria").value;
  const ruta=document.getElementById("fotoRuta").value;
  const url=document.getElementById("fotoUrl").value;
  const {error}=await supabaseClient
    .from("galeria_fotos")
    .insert({
      titulo,
      categoria:categoria || null,
      ruta:ruta || null,
      url
    });
  if(error){
    console.error(error);
    showMessage("No se pudo agregar la foto.",true);
    return;
  }
  event.target.reset();
  showMessage("Foto agregada correctamente.");
  loadFotos();
}
async function loadFotos(){
  const box=document.getElementById("fotosList");
  box.innerHTML="Cargando...";
  const {data,error}=await supabaseClient
    .from("galeria_fotos")
    .select("*")
    .order("creado_en",{ascending:false});
  if(error){
    box.innerHTML=
      `<div class="empty">No se pudieron cargar las fotos.</div>`;
    console.error(error);
    return;
  }
  if(!data.length){
    box.innerHTML=
      `<div class="empty">No hay fotos.</div>`;
    return;
  }
  box.innerHTML=data.map(f=>`
    <div class="record">
      <div class="record-header">
        <div>
          <div class="record-title">
            ${escapeHtml(f.titulo)}
          </div>
          <p>Categoría: ${escapeHtml(f.categoria || "")}</p>
          <p>
            <a
              href="${escapeHtml(f.url || "")}"
              target="_blank">
              Ver imagen
            </a>
          </p>
        </div>
        <button
          class="danger"
          onclick="deleteRecord('galeria_fotos','${escapeHtml(f.id)}','${escapeHtml(f.titulo)}')">
          ELIMINAR
        </button>
      </div>
    </div>
  `).join("");
}
/* =========================
   PRODUCTOS
========================= */
async function createProducto(event){
  event.preventDefault();
  const nombre=document.getElementById("productoNombre").value;
  const categoria=document.getElementById("productoCategoria").value;
  const descripcion=document.getElementById("productoDescripcion").value;
  const precio=document.getElementById("productoPrecio").value;
  const disponible=document.getElementById("productoDisponible").checked;
  const {error}=await supabaseClient
    .from("productos")
    .insert({
      nombre,
      categoria:categoria || null,
      descripcion:descripcion || null,
      precio:precio ? Number(precio) : 0,
      disponible
    });
  if(error){
    console.error(error);
    showMessage("No se pudo crear el producto.",true);
    return;
  }
  event.target.reset();
  document.getElementById("productoDisponible").checked=true;
  showMessage("Producto creado correctamente.");
  loadProductos();
}
async function loadProductos(){
  const box=document.getElementById("productosList");
  box.innerHTML="Cargando...";
  const {data,error}=await supabaseClient
    .from("productos")
    .select("*")
    .order("created_at",{ascending:false});
  if(error){
    box.innerHTML=
      `<div class="empty">No se pudieron cargar los productos.</div>`;
    console.error(error);
    return;
  }
  if(!data.length){
    box.innerHTML=
      `<div class="empty">No hay productos.</div>`;
    return;
  }
  box.innerHTML=data.map(p=>`
    <div class="record">
      <div class="record-header">
        <div>
          <div class="record-title">
            ${escapeHtml(p.nombre)}
          </div>
          <p>Categoría: ${escapeHtml(p.categoria || "")}</p>
          <p>${escapeHtml(p.descripcion || "")}</p>
          <p>Precio: $${escapeHtml(p.precio || 0)}</p>
          <p>${p.disponible ? "Disponible" : "No disponible"}</p>
        </div>
        <button
          class="danger"

async function createJuego(event){
  event.preventDefault();
  const name=document.getElementById("juegoNombre").value;
  const description=document.getElementById("juegoDescripcion").value;
  const icon=document.getElementById("juegoIcono").value;
  const points_reward=document.getElementById("juegoPuntos").value;
  const tokens_reward=document.getElementById("juegoTokens").value;
  const active=document.getElementById("juegoActivo").checked;
  const {error}=await supabaseClient
    .from("games")
    .insert({
      name,
      description:description || null,
      icon:icon || null,
      points_reward:points_reward ? Number(points_reward) : 0,
      tokens_reward:tokens_reward ? Number(tokens_reward) : 0,
      active
    });
  if(error){
    console.error(error);
    showMessage("No se pudo crear el juego.",true);
    return;
  }
  event.target.reset();
  document.getElementById("juegoActivo").checked=true;
  showMessage("Juego creado correctamente.");
  loadJuegos();
}

async function createTorneo(event){
  event.preventDefault();
  const nombre=document.getElementById("torneoNombre").value;
  const juego=document.getElementById("torneoJuego").value;
  const fecha=document.getElementById("torneoFecha").value;
  const inscripcion=document.getElementById("torneoInscripcion").value;
  const premio_primero=document.getElementById("torneoPremio1").value;
  const premio_segundo=document.getElementById("torneoPremio2").value;
  const max_participantes=document.getElementById("torneoMax").value;
  const estado=document.getElementById("torneoEstado").value;
  const notas=document.getElementById("torneoNotas").value;
  const {error}=await supabaseClient
    .from("torneos")
    .insert({
      nombre,
      juego,
      fecha:fecha || null,
      inscripcion:inscripcion ? Number(inscripcion) : 0,
      premio_primero:premio_primero ? Number(premio_primero) : 0,
