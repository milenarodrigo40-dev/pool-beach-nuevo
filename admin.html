<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pool & Beach — Administración</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f8;
      color: #17202a;
    }

    header {
      background: #083b4c;
      color: white;
      padding: 20px;
    }

    header .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 20px;
    }

    .tabs button {
      border: 0;
      background: #d9e5e8;
      color: #083b4c;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: bold;
    }

    .tabs button.active {
      background: #0b7d8c;
      color: white;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ccd5d8;
      border-radius: 9px;
      padding: 11px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button.btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      background: #0b7d8c;
      color: white;
      font-weight: bold;
    }

    button.btn.secondary {
      background: #355c66;
    }

    button.btn.danger {
      background: #b42318;
    }

    button.btn.success {
      background: #087f5b;
    }

    button.btn.light {
      background: #d9e5e8;
      color: #083b4c;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .status.on {
      background: #d1fadf;
      color: #087f5b;
    }

    .status.off {
      background: #fee4e2;
      color: #b42318;
    }

    .muted {
      color: #667085;
    }

    .error {
      color: #b42318;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .success-message {
      color: #087f5b;
      font-weight: bold;
    }

    .qr-box {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    .qr-image {
      width: 220px;
      height: 220px;
      object-fit: contain;
      border: 1px solid #ddd;
      padding: 8px;
      background: white;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .photo-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #667085;
      background: #fff;
      border-radius: 12px;
    }

    .loading {
      padding: 15px;
      color: #667085;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }

      main {
        padding: 12px;
      }

      .qr-image {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>Pool & Beach — Administración</h1>

    <button class="btn" id="refreshAll">
      🔄 Actualizar todo
    </button>
  </div>
</header>

<main>

  <nav class="tabs" id="tabs"></nav>

  <!-- MESAS -->
  <section id="mesas" class="panel">

    <div class="card">
      <h2>🪑 Mesas</h2>

      <p class="muted">
        Administrá las mesas y generá el QR de acceso para cada una.
      </p>

      <div class="form-grid">

        <div>
          <label for="newTableNumber">Número de mesa</label>
          <input
            id="newTableNumber"
            type="number"
            min="1"
            placeholder="Ej.: 9"
          />
        </div>

        <div>
          <label for="newTableName">Nombre</label>
          <input
            id="newTableName"
            type="text"
            placeholder="Ej.: Mesa 9"
          />
        </div>

      </div>

      <div class="buttons">
        <button class="btn" id="createTable">
          ➕ Crear mesa
        </button>

        <button class="btn light" id="refreshTables">
          🔄 Actualizar mesas
        </button>
      </div>

      <div id="tablesMessage"></div>
    </div>

    <div id="tablesGrid" class="grid"></div>

  </section>

  <!-- JUEGOS -->
  <section id="juegos" class="panel">

    <div class="card">
      <h2>🎮 Juegos</h2>

      <div class="form-grid">

        <div>
          <label>Nombre</label>
          <input id="gameName" placeholder="Nombre del juego">
        </div>

        <div>
          <label>Descripción</label>
          <input id="gameDescription" placeholder="Descripción">
        </div>

        <div>
          <label>Puntos</label>
          <input id="gamePoints" type="number" value="0">
        </div>

      </div>

      <div class="buttons">
        <button class="btn" id="saveGame">
          ➕ Guardar juego
        </button>

        <button class="btn light" id="refreshGames">
          🔄 Actualizar
        </button>
      </div>

      <div id="gamesMessage"></div>
    </div>

    <div id="gamesList" class="grid"></div>

  </section>

  <!-- TRIVIA -->
  <section id="trivia" class="panel">

    <div class="card">
      <h2>🧠 Trivia</h2>

      <div class="form-grid">

        <div style="grid-column:1/-1">
          <label>Pregunta</label>
          <input id="triviaQuestion" placeholder="Escribí la pregunta">
        </div>

        <div>
          <label>Respuesta A</label>
          <input id="triviaA">
        </div>

        <div>
          <label>Respuesta B</label>
          <input id="triviaB">
        </div>

        <div>
          <label>Respuesta C</label>
          <input id="triviaC">
        </div>

        <div>
          <label>Respuesta D</label>
          <input id="triviaD">
        </div>

        <div>
          <label>Respuesta correcta</label>
          <select id="triviaCorrect">
            <option value="0">A</option>
            <option value="1">B</option>
            <option value="2">C</option>
            <option value="3">D</option>
          </select>
        </div>

        <div>
          <label>Puntos</label>
          <input id="triviaPoints" type="number" value="10">
        </div>

      </div>

      <div class="buttons">
        <button class="btn" id="saveTrivia">
          ➕ Agregar pregunta
        </button>

        <button class="btn light" id="refreshTrivia">
          🔄 Actualizar preguntas
        </button>
      </div>

      <div id="triviaMessage"></div>
    </div>

    <div id="triviaList"></div>

  </section>

  <!-- DUELOS -->
  <section id="duelos" class="panel">

    <div class="card">
      <h2>⚔️ Duelos</h2>

      <div class="buttons">
        <button class="btn" id="refreshDuels">
          🔄 Actualizar duelos
        </button>
      </div>
    </div>

    <div id="duelsList"></div>

  </section>

  <!-- TORNEOS -->
  <section id="torneos" class="panel">

    <div class="card">
      <h2>🏆 Torneos</h2>

      <div class="form-grid">

        <div>
          <label>Nombre</label>
          <input id="tournamentName" placeholder="Nombre del torneo">
        </div>

        <div>
          <label>Premio</label>
          <input id="tournamentPrize" placeholder="Premio">
        </div>

      </div>

      <div class="buttons">
        <button class="btn" id="saveTournament">
          ➕ Crear torneo
        </button>

        <button class="btn light" id="refreshTournaments">
          🔄 Actualizar
        </button>
      </div>

      <div id="tournamentsMessage"></div>
    </div>

    <div id="tournamentsList"></div>

  </section>

  <!-- PREMIOS -->
  <section id="premios" class="panel">

    <div class="card">
      <h2>🎁 Premios</h2>

      <div class="form-grid">

        <div>
          <label>Nombre</label>
          <input id="prizeName" placeholder="Nombre del premio">
        </div>

        <div>
          <label>Costo en puntos</label>
          <input id="prizeCost" type="number" value="0">
        </div>

      </div>

      <div class="buttons">
        <button class="btn" id="savePrize">
          ➕ Agregar premio
        </button>

        <button class="btn light" id="refreshPrizes">
          🔄 Actualizar
        </button>
      </div>

      <div id="prizesMessage"></div>
    </div>

    <div id="prizesList" class="grid"></div>

  </section>

  <!-- GALERÍA -->
  <section id="galeria" class="panel">

    <div class="card">
      <h2>📸 Galería</h2>

      <p class="muted">
        Seleccioná fotos directamente desde el teléfono y cargalas al proyecto.
      </p>

      <label for="photoInput">
        Fotos
      </label>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        multiple
      />

      <label for="photoCaption">
        Descripción
      </label>

      <input
        id="photoCaption"
        type="text"
        placeholder="Descripción de las fotos"
      />

      <div class="buttons">

        <button class="btn" id="uploadPhotos">
          📤 Cargar fotos
        </button>

        <button class="btn light" id="refreshGallery">
          🔄 Actualizar galería
        </button>

      </div>

      <div id="uploadStatus"></div>
    </div>

    <div id="galleryList" class="photo-grid"></div>

  </section>

  <!-- RESERVAS -->
  <section id="reservas" class="panel">

    <div class="card">
      <h2>📅 Reservas</h2>

      <button class="btn" id="refreshReservations">
        🔄 Actualizar reservas
      </button>
    </div>

    <div id="reservasList"></div>

  </section>

  <!-- PEDIDOS -->
  <section id="pedidos" class="panel">

    <div class="card">
      <h2>🛒 Pedidos</h2>

      <button class="btn" id="refreshOrders">
        🔄 Actualizar pedidos
      </button>
    </div>

    <div id="pedidosList"></div>

  </section>

</main>

<script>

const SUPABASE_URL =
  "https://nmpakeovqkdajtswjpgm.supabase.co";

/*
  IMPORTANTE:
  Pegá acá la ANON/PUBLISHABLE KEY pública de tu proyecto Supabase.
  NO uses la service_role key.
*/
const SUPABASE_ANON_KEY =
  "PEGAR_AQUI_LA_ANON_KEY_PUBLICA";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const $ = (id) => document.getElementById(id);


const tabs = [
  ["mesas", "🪑 Mesas"],
  ["juegos", "🎮 Juegos"],
  ["trivia", "🧠 Trivia"],
  ["duelos", "⚔️ Duelos"],
  ["torneos", "🏆 Torneos"],
  ["premios", "🎁 Premios"],
  ["galeria", "📸 Galería"],
  ["reservas", "📅 Reservas"],
  ["pedidos", "🛒 Pedidos"]
];


$("tabs").innerHTML = tabs
  .map(([id, label]) =>
    `<button data-tab="${id}">${label}</button>`
  )
  .join("");


document.querySelectorAll("#tabs button").forEach((button) => {

  button.addEventListener("click", () => {
    showTab(button.dataset.tab);
  });

});


function showTab(id) {

  document
    .querySelectorAll(".panel")
    .forEach(panel => panel.classList.remove("active"));

  const panel = $(id);

  if (panel) {
    panel.classList.add("active");
  }

  document
    .querySelectorAll("#tabs button")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.tab === id
      );
    });

  loadSection(id);
}


function message(container, text, type = "success") {

  const el = $(container);

  if (!el) return;

  el.className =
    type === "error"
      ? "error"
      : "success-message";

  el.textContent = text;
}


/* =========================
   MESAS
========================= */

async function getTables() {

  const { data, error } =
    await supabaseClient
      .from("tables_pool")
      .select("*")
      .order("table_number", { ascending: true });

  if (error) {
    throw error;
  }

  return data || [];
}


function getPublicTableUrl(table) {

  const base =
    window.location.origin +
    window.location.pathname
      .replace(/admin\.html.*$/i, "");

  return (
    base +
    "index.html?mesa=" +
    encodeURIComponent(
      table.id || table.table_number
    )
  );
}


async function createQR(url) {

  return await QRCode.toDataURL(
    url,
    {
      width: 500,
      margin: 3,
      errorCorrectionLevel: "H"
    }
  );

}


async function renderTables() {

  const container = $("tablesGrid");

  container.innerHTML =
    `<div class="loading">Cargando mesas...</div>`;

  try {

    const tables = await getTables();

    if (!tables.length) {

      container.innerHTML =
        `<div class="empty">
          No hay mesas cargadas.
        </div>`;

      return;
    }

    container.innerHTML = "";

    for (const table of tables) {

      const number =
        table.table_number ??
        table.numero ??
        table.number ??
        "";

      const name =
        table.name ||
        table.nombre ||
        `Mesa ${number}`;

      const active =
        table.active !== false;

      const url =
        getPublicTableUrl(table);

      const qr =
        await createQR(url);

      const card =
        document.createElement("div");

      card.className =
        "card";

      card.innerHTML = `
        <h3>
          🪑 Mesa ${number}
        </h3>

        <p>
          ${name}
        </p>

        <span class="status ${active ? "on" : "off"}">
          ${active ? "ACTIVA" : "INACTIVA"}
        </span>

        <div class="qr-box">

          <img
            class="qr-image"
            src="${qr}"
            alt="QR Mesa ${number}"
          >

          <div>

            <p class="muted">
              ${url}
            </p>

            <div class="buttons">

              <button
                class="btn"
                data-action="open"
              >
                🔗 Abrir acceso
              </button>

              <button
                class="btn success"
                data-action="download"
              >
                ⬇️ Descargar QR
              </button>

              <button
                class="btn secondary"
                data-action="print"
              >
                🖨️ Imprimir QR
              </button>

              <button
                class="btn ${active ? "danger" : "success"}"
                data-action="toggle"
              >
                ${active ? "Desactivar" : "Activar"}
              </button>

            </div>

          </div>

        </div>
      `;


      card
        .querySelector('[data-action="open"]')
        .onclick = () => {

          window.open(
            url,
            "_blank",
            "noopener"
          );

        };


      card
        .querySelector('[data-action="download"]')
        .onclick = () => {

          const link =
            document.createElement("a");

          link.href = qr;

          link.download =
            `Pool-Beach-QR-Mesa-${number}.png`;

          document.body.appendChild(link);

          link.click();

          link.remove();

        };


      card
        .querySelector('[data-action="print"]')
        .onclick = () => {

          const win =
            window.open(
              "",
              "_blank"
            );

          if (!win) {
            alert("El navegador bloqueó la ventana de impresión.");
            return;
          }

          win.document.write(`
            <!doctype html>
            <html>
            <head>
              <title>QR Mesa ${number}</title>
            </head>
            <body style="
              text-align:center;
              font-family:Arial;
              padding:30px;
            ">
              <h1>Pool & Beach</h1>
              <h2>Mesa ${number}</h2>
              <img
                src="${qr}"
                style="width:400px;height:400px"
              >
              <p>Escaneá para entrar a los juegos.</p>
            </body>
            </html>
          `);

          win.document.close();

          win.onload = () => {
            win.focus();
            win.print();
          };

        };


      card
        .querySelector('[data-action="toggle"]')
        .onclick = async () => {

          if (!table.id) {

            alert(
              "Esta mesa no tiene ID y no puede modificarse."
            );

            return;
          }

          const { error } =
            await supabaseClient
              .from("tables_pool")
              .update({
                active: !active
              })
              .eq("id", table.id);

          if (error) {

            message(
              "tablesMessage",
              error.message,
              "error"
            );

            return;
          }

          await renderTables();

        };


      container.appendChild(card);

    }

  } catch (error) {

    container.innerHTML = "";

    message(
      "tablesMessage",
      "Error cargando mesas: " +
      error.message,
      "error"
    );

  }

}


$("createTable").onclick =
  async () => {

    const number =
      Number(
        $("newTableNumber").value
      );

    const name =
      $("newTableName").value.trim();

    if (!number) {

      message(
        "tablesMessage",
        "Ingresá el número de mesa.",
        "error"
      );

      return;
    }


    const { data: existing, error: checkError } =
      await supabaseClient
        .from("tables_pool")
        .select("id")
        .eq("table_number", number)
        .maybeSingle();


    if (checkError) {

      message(
        "tablesMessage",
        checkError.message,
        "error"
      );

      return;
    }


    if (existing) {

      message(
        "tablesMessage",
        "Esa mesa ya existe.",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("tables_pool")
        .insert({
          table_number: number,
          name: name || `Mesa ${number}`,
          active: true
        });


    if (error) {

      message(
        "tablesMessage",
        "No se pudo crear la mesa: " +
        error.message,
        "error"
      );

      return;
    }


    $("newTableNumber").value = "";
    $("newTableName").value = "";

    message(
      "tablesMessage",
      "Mesa creada correctamente."
    );

    await renderTables();

  };


$("refreshTables").onclick =
  renderTables;


/* =========================
   JUEGOS
========================= */

async function loadGames() {

  const container =
    $("gamesList");

  container.innerHTML =
    `<div class="loading">Cargando juegos...</div>`;

  const { data, error } =
    await supabaseClient
      .from("games")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if (error) {

    container.innerHTML = "";

    message(
      "gamesMessage",
      error.message,
      "error"
    );

    return;
  }


  if (!data?.length) {

    container.innerHTML =
      `<div class="empty">
        No hay juegos cargados.
      </div>`;

    return;
  }


  container.innerHTML =
    data.map(game => `
      <div class="card">

        <h3>${escapeHTML(game.name || "")}</h3>

        <p>
          ${escapeHTML(
            game.description || ""
          )}
        </p>

        <p>
          Puntos:
          <strong>
            ${game.points ?? 0}
          </strong>
        </p>

        <span class="status ${
          game.active === false
            ? "off"
            : "on"
        }">
          ${
            game.active === false
              ? "INACTIVO"
              : "ACTIVO"
          }
        </span>

      </div>
    `).join("");

}


$("saveGame").onclick =
  async () => {

    const name =
      $("gameName").value.trim();

    if (!name) {

      message(
        "gamesMessage",
        "Ingresá el nombre del juego.",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("games")
        .insert({
          name,
          description:
            $("gameDescription").value.trim(),
          points:
            Number(
              $("gamePoints").value
            ) || 0,
          active: true
        });


    if (error) {

      message(
        "gamesMessage",
        error.message,
        "error"
      );

      return;
    }


    $("gameName").value = "";
    $("gameDescription").value = "";
    $("gamePoints").value = "0";

    message(
      "gamesMessage",
      "Juego guardado correctamente."
    );

    loadGames();

  };


$("refreshGames").onclick =
  loadGames;


/* =========================
   TRIVIA
========================= */

async function loadTrivia() {

  const container =
    $("triviaList");

  container.innerHTML =
    `<div class="loading">Cargando preguntas...</div>`;

  const { data, error } =
    await supabaseClient
      .from("trivia_questions")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    container.innerHTML = "";

    message(
      "triviaMessage",
      error.message,
      "error"
    );

    return;
  }


  if (!data?.length) {

    container.innerHTML =
      `<div class="empty">
        No hay preguntas cargadas.
      </div>`;

    return;
  }


  container.innerHTML =
    data.map((q, index) => {

      const options =
        Array.isArray(q.options)
          ? q.options
          : [];


      return `
        <div class="card">

          <h3>
            ${index + 1}. 
            ${escapeHTML(

            )}

              )
            )}
          </strong>

/* =========================

========================= */

async function loadGallery() {

  const container =
    $("galleryList");

  container.innerHTML =
    `<div class="loading">Cargando galería...</div>`;


  const { data, error } =
    await supabaseClient
      .from("galeria_fotos")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    container.innerHTML = "";

    message(
      "uploadStatus",
      error.message,
      "error"
    );

    return;
  }


  if (!data?.length) {

    container.innerHTML =
      `<div class="empty">
        No hay fotos cargadas.
      </div>`;

    return;
  }


  container.innerHTML =
    data.map(photo => `
      <div class="card photo-card">

        <img
          src="${escapeAttribute(
            photo.url || ""
          )}"
          alt="${escapeAttribute(
            photo.caption || "Foto"
          )}"
        >

        <p>
          ${escapeHTML(
            photo.caption || ""
          )}
        </p>

      </div>
    `).join("");

}


$("uploadPhotos").onclick =
  async () => {

    const files =
      Array.from(
        $("photoInput").files || []
      );


    if (!files.length) {

      message(
        "uploadStatus",
        "Seleccioná al menos una foto desde el teléfono.",
        "error"
      );

      return;
    }


    $("uploadStatus").className =
      "loading";

    $("uploadStatus").textContent =
      "Subiendo fotos...";


    const caption =
      $("photoCaption")
        .value
        .trim();


    for (const file of files) {

      if (!file.type.startsWith("image/")) {

        message(
          "uploadStatus",
          `${file.name} no es una imagen.`,
          "error"
        );

        return;
      }


      const safeName =
        file.name
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const path =
        `galeria/${Date.now()}-${crypto.randomUUID()}-${safeName}`;


      const upload =
        await supabaseClient
          .storage
          .from("Galeria")
          .upload(
            path,
            file,
            {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            }
          );


      if (upload.error) {

        message(
          "uploadStatus",
          "Error al subir " +
          file.name +
          ": " +
          upload.error.message,
          "error"
        );

        return;
      }


      const publicUrl =
        supabaseClient
          .storage
          .from("Galeria")
          .getPublicUrl(path)
          .data
          .publicUrl;


      const insert =
        await supabaseClient
          .from("galeria_fotos")
          .insert({
            url: publicUrl,
            caption,
            active: true
          });


      if (insert.error) {

        message(
          "uploadStatus",
          "La foto se subió a Storage pero no pudo registrarse: " +
          insert.error.message,
          "error"
        );

        return;
      }

    }


    $("photoInput").value = "";
    $("photoCaption").value = "";

    message(
      "uploadStatus",
      "Fotos cargadas correctamente."
    );


    await loadGallery();

  };


$("refreshGallery").onclick =
  loadGallery;

/* =========================
   UTILIDADES
========================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value);

}
