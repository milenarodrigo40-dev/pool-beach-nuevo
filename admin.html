<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Administración | Pool & Beach</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f9;
  color:#17202a;
}
header{
  background:#071d2b;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0;font-size:25px}
header p{margin:6px 0 0;opacity:.85}
.container{
  width:min(1100px,94%);
  margin:20px auto;
}
.login{
  max-width:430px;
  margin:50px auto;
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}
input,select,textarea,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:9px;
  border:1px solid #ccd5db;
  font-size:15px;
}
textarea{
  min-height:90px;
  resize:vertical;
}
button{
  background:#087ea4;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
button:hover{opacity:.9}
button.danger,
.delete-button{
  background:#d62828!important;
  color:white!important;
}
button.secondary{background:#52616b}
.logout{
  background:#9b2226;
  width:auto;
  padding:10px 18px;
}
.hidden{display:none!important}
.message{
  margin:10px 0;
  padding:12px;
  border-radius:9px;
  background:#dff6e9;
  color:#146c43;
}
.message.error{
  background:#ffe1e1;
  color:#a61b1b;
}
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}
nav button{
  width:auto;
  background:#0b3447;
  padding:10px 14px;
}
nav button.active{background:#087ea4}
.section{display:none}
.section.active{display:block}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}
.card h2{margin-top:0}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
}
.record{
  border:1px solid #dce3e7;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
  background:#fafcfd;
}
.record-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:8px;
}
.record p{margin:7px 0}
.record-actions{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #e1e6e9;
}
.delete-button{
  width:100%!important;
  display:block!important;
  visibility:visible!important;
  opacity:1!important;
  padding:12px!important;
  margin-top:10px!important;
}
.small{
  font-size:13px;
  color:#667;
  word-break:break-all;
}
.empty{
  padding:20px;
  text-align:center;
  color:#6b7780;
}
.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  background:#e7f4f8;
  font-size:12px;
  font-weight:bold;
}
.preview{
  width:100%;
  max-width:250px;
  height:160px;
  object-fit:cover;
  border-radius:10px;
  margin-top:8px;
}
.check{
  display:flex;
  align-items:center;
  gap:8px;
  margin:10px 0;
}
.check input{
  width:auto;
  margin:0;
}
hr{
  border:0;
  border-top:1px solid #e1e6e9;
  margin:20px 0;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}
.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-bottom:20px;
}
.stat{
  background:#071d2b;
  color:white;
  border-radius:14px;
  padding:18px;
  text-align:center;
}
.stat strong{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}
@media(max-width:600px){
  .container{width:94%}
  nav{
    display:grid;
    grid-template-columns:1fr 1fr;
  }
  nav button{width:100%}
  .card{padding:15px}
  .logout{width:100%}
  .topbar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<header>
  <h1>Pool & Beach</h1>
  <p>Panel de Administración</p>
</header>
<div class="container">
<div id="loginBox" class="login">
  <h2>🔐 Iniciar sesión</h2>
  <input
    id="email"
    type="email"
    placeholder="Correo electrónico"
    autocomplete="email"
    required
  >
  <input
    id="password"
    type="password"
    placeholder="Contraseña"
    autocomplete="current-password"
    required
  >
  <button type="button" onclick="login()">
    INICIAR SESIÓN
  </button>
  <div id="loginMessage"></div>
</div>
<div id="panel" class="hidden">
<div class="topbar">
  <strong>Panel de control</strong>
  <button
    type="button"
    class="logout"
    onclick="logout()"
  >
    Cerrar sesión
  </button>
</div>
<div id="stats" class="stat-grid"></div>
<nav>
  <button type="button" onclick="showSection('reservas',this)">
    Reservas
  </button>
  <button type="button" onclick="showSection('mesas',this)">
    Mesas
  </button>
  <button type="button" onclick="showSection('promociones',this)">
    Promociones
  </button>
  <button type="button" onclick="showSection('fotos',this)">
    Fotos
  </button>
  <button type="button" onclick="showSection('productos',this)">
    Productos
  </button>
  <button type="button" onclick="showSection('pedidos',this)">
    Pedidos
  </button>
  <button type="button" onclick="showSection('juegos',this)">
    Juegos
  </button>
  <button type="button" onclick="showSection('ranking',this)">
    Ranking
  </button>
  <button type="button" onclick="showSection('torneos',this)">
    Torneos
  </button>
</nav>
<div id="globalMessage"></div>
<section id="reservas" class="section">
<div class="card">
<h2>📅 Reservas</h2>
<button type="button" onclick="loadReservas()">
Actualizar reservas
</button>
<div id="reservasList"></div>
</div>
</section>
<section id="mesas" class="section">
<div class="card">
<h2>🪑 Mesas</h2>
<form onsubmit="createMesa(event)">
<div class="grid">
<input id="mesaNumero" type="number" placeholder="Número de mesa" required>
<input id="mesaNombre" type="text" placeholder="Nombre de mesa">
<input id="mesaServicio" type="text" placeholder="Servicio">
</div>
<button type="submit">Agregar mesa</button>
</form>
<hr>
<div id="mesasList"></div>
</div>
</section>
<section id="promociones" class="section">
<div class="card">
<h2>🎁 Promociones</h2>
<form onsubmit="createPromocion(event)">
<input id="promoTitulo" type="text" placeholder="Título" required>
<textarea id="promoDescripcion" placeholder="Descripción"></textarea>
<input id="promoPrecio" type="number" step="0.01" placeholder="Precio">
<label class="check">
<input id="promoActiva" type="checkbox" checked>
Promoción activa
</label>
<button type="submit">Agregar promoción</button>
</form>
<hr>
<div id="promocionesList"></div>
</div>
</section>
<section id="fotos" class="section">
<div class="card">
<h2>📸 Fotos / Galería</h2>
<form onsubmit="createFoto(event)">
<input id="fotoTitulo" type="text" placeholder="Título" required>
<input id="fotoCategoria" type="text" placeholder="Categoría">
<input id="fotoRuta" type="text" placeholder="Nombre o ruta">
<input id="fotoUrl" type="url" placeholder="URL de la imagen" required>
<button type="submit">Agregar foto</button>
</form>
<hr>
<div id="fotosList"></div>
</div>
</section>
<section id="productos" class="section">
<div class="card">
<h2>🍔 Productos</h2>
<form onsubmit="createProducto(event)">
<input id="productoNombre" type="text" placeholder="Nombre" required>
<input id="productoCategoria" type="text" placeholder="Categoría">
<textarea id="productoDescripcion" placeholder="Descripción"></textarea>
<input id="productoPrecio" type="number" step="0.01" min="0" placeholder="Precio">
<label class="check">
<input id="productoDisponible" type="checkbox" checked>
Disponible
</label>
<button type="submit">Agregar producto</button>
</form>
<hr>
<div id="productosList"></div>
</div>
</section>
<section id="pedidos" class="section">
<div class="card">
<h2>🛒 Pedidos</h2>
<button type="button" onclick="loadPedidos()">
Actualizar pedidos
</button>
<div id="pedidosList"></div>
</div>
</section>
<section id="juegos" class="section">
<div class="card">
<h2>🎮 Juegos</h2>
<form onsubmit="createJuego(event)">
<input id="juegoNombre" type="text" placeholder="Nombre del juego" required>
<textarea id="juegoDescripcion" placeholder="Descripción"></textarea>
<input id="juegoIcono" type="text" placeholder="Icono o emoji">
<input id="juegoPuntos" type="number" value="0" placeholder="Puntos">
<input id="juegoTokens" type="number" value="0" placeholder="Tokens">
<label class="check">
<input id="juegoActivo" type="checkbox" checked>
Juego activo
</label>
<button type="submit">Agregar juego</button>
</form>
<hr>
<div id="juegosList"></div>
</div>
</section>
<section id="ranking" class="section">
<div class="card">
<h2>🏆 Ranking</h2>
<button type="button" onclick="loadRanking()">
Actualizar ranking
</button>
<div id="rankingList"></div>
</div>
</section>
<section id="torneos" class="section">
<div class="card">
<h2>🏆 Torneos</h2>
<form onsubmit="createTorneo(event)">
<input id="torneoNombre" type="text" placeholder="Nombre del torneo" required>
<input id="torneoJuego" type="text" placeholder="Juego" required>
<input id="torneoFecha" type="date">
<input id="torneoInscripcion" type="number" step="0.01" placeholder="Inscripción">
<input id="torneoPremio1" type="number" step="0.01" placeholder="Premio 1°">
<input id="torneoPremio2" type="number" step="0.01" placeholder="Premio 2°">
<input id="torneoMax" type="number" placeholder="Máximo de participantes">
<select id="torneoEstado">
<option value="abierto">Abierto</option>
<option value="cerrado">Cerrado</option>
<option value="finalizado">Finalizado</option>
</select>
<textarea id="torneoNotas" placeholder="Notas"></textarea>
<button type="submit">Agregar torneo</button>
</form>
<hr>
<div id="torneosList"></div>
</div>
</section>
</div>
</div>
<script>
const SUPABASE_URL =
"https://nmpakeovqkdajtswjpgm.supabase.co";
const SUPABASE_KEY =
"sb_publishable_FyuFdiW_2eXNScLd9MShng_rLxxztsu";
const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
function escapeHtml(value){
  if(value===null || value===undefined) return "";
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function money(value){
  if(value===null || value===undefined || value===""){
    return "$0";
  }
  return "$"+Number(value).toLocaleString("es-AR");
}
function showMessage(text,error=false){
  const box=document.getElementById("globalMessage");
  box.innerHTML=
    `<div class="message ${error ? "error":""}">
      ${escapeHtml(text)}
    </div>`;
  setTimeout(()=>{
    box.innerHTML="";
  },5000);
}
function showLoginMessage(text,error=false){
  const box=document.getElementById("loginMessage");
  box.innerHTML=
    `<div class="message ${error ? "error":""}">
      ${escapeHtml(text)}
    </div>`;
}
async function login(){
  const email=
    document.getElementById("email").value.trim();
  const password=
    document.getElementById("password").value;
  if(!email || !password){
    showLoginMessage(
      "Ingresá el correo y la contraseña.",
      true
    );
    return;
  }
  showLoginMessage("Iniciando sesión...");
  const {error}=
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });
  if(error){
    showLoginMessage(
      "Error: "+error.message,
      true
    );
    return;
  }
  showLoginMessage("Sesión iniciada correctamente.");
  await checkSession();
}
async function logout(){
  await supabaseClient.auth.signOut();
  document
    .getElementById("panel")
    .classList.add("hidden");
  document
    .getElementById("loginBox")
    .classList.remove("hidden");
  document.getElementById("email").value="";
  document.getElementById("password").value="";
  document.getElementById("stats").innerHTML="";
  showLoginMessage("Sesión cerrada.");
}
async function checkSession(){
  const {data,error}=
    await supabaseClient.auth.getSession();
  if(error){
    console.error(error);
    return;
  }
  if(data.session){
    document
      .getElementById("loginBox")
      .classList.add("hidden");
    document
      .getElementById("panel")
      .classList.remove("hidden");
    const firstButton=
      document.querySelector("nav button");
    showSection("reservas",firstButton);
    await refreshAll();
  }else{
    document
      .getElementById("loginBox")
      .classList.remove("hidden");
    document
      .getElementById("panel")
      .classList.add("hidden");
  }
}
function showSection(id,button){
  document
    .querySelectorAll(".section")
    .forEach(section=>{
      section.classList.remove("active");
    });
  const section=document.getElementById(id);
  if(section){
    section.classList.add("active");
  }
  document
    .querySelectorAll("nav button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
  if(button){
    button.classList.add("active");
  }
  if(id==="reservas") loadReservas();
  if(id==="mesas") loadMesas();
  if(id==="promociones") loadPromociones();
  if(id==="fotos") loadFotos();
  if(id==="productos") loadProductos();
  if(id==="pedidos") loadPedidos();
  if(id==="juegos") loadJuegos();
  if(id==="ranking") loadRanking();
  if(id==="torneos") loadTorneos();
}
async function deleteRecord(table,id,name,reloadFunction){
  const confirmDelete=
    confirm(
      "¿Seguro que querés eliminar:\n\n"+
      name+
      "\n\nEsta acción no se puede deshacer."
    );
  if(!confirmDelete) return;
  const {error}=
    await supabaseClient
      .from(table)
      .delete()
      .eq("id",id);
  if(error){
    console.error(error);
    showMessage(
      "No se pudo eliminar. "+error.message,
      true
    );
    return;
  }
  showMessage("Eliminado correctamente.");
  if(reloadFunction){
    await reloadFunction();
  }
  updateStats();
}
async function loadReservas(){
  const box=document.getElementById("reservasList");
  box.innerHTML=
    "<div class='empty'>Cargando reservas...</div>";
  const {data,error}=
    await supabaseClient
      .from("reservas")
      .select("*")
      .order("fecha",{ascending:true})
      .order("hora",{ascending:true});
  if(error){
    box.innerHTML=
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;
    return;
  }
  if(!data || data.length===0){
    box.innerHTML=
      "<div class='empty'>No hay reservas.</div>";
    return;
  }
  box.innerHTML=data.map(r=>`
    <div class="record">
      <div class="record-title">
        📅 ${escapeHtml(r.nombre || "Sin nombre")}
      </div>
      <p><strong>Fecha:</strong> ${escapeHtml(r.fecha || "-")}</p>
      <p><strong>Hora:</strong> ${escapeHtml(r.hora || "-")}</p>
      <p><strong>Teléfono:</strong> ${escapeHtml(r.telefono || "-")}</p>
      <p><strong>Servicio:</strong> ${escapeHtml(r.servicio || "-")}</p>
      <p><strong>Personas:</strong> ${escapeHtml(r.cantidad_personas || "-")}</p>
      <p>
        <strong>Estado:</strong>
        <span class="status">
          ${escapeHtml(r.estado || "pendiente")}
        </span>
      </p>
      <p><strong>Notas:</strong> ${escapeHtml(r.notas || "-")}</p>
      <div class="record-actions">
        <button
          type="button"
          class="delete-button"
          onclick='deleteRecord(
            "reservas",
            ${JSON.stringify(r.id)},
            ${JSON.stringify(r.nombre || "Reserva")},
            loadReservas
          )'
        >
          🗑 ELIMINAR RESERVA
        </button>
      </div>
    </div>
  `).join("");
}
async function createMesa(event){
  event.preventDefault();
  const numero=
    document.getElementById("mesaNumero").value;
  const nombre=
    document.getElementById("mesaNombre").value.trim();
  const servicio=
    document.getElementById("mesaServicio").value.trim();
  const {error}=
    await supabaseClient
      .from("mesas")
      .insert({
        numero:Number(numero),
        nombre:nombre || `Mesa ${numero}`,
        servicio,
        activa:true
      });
  if(error){
    showMessage(
      "No se pudo crear la mesa: "+error.message,
      true
    );
    return;
  }
  event.target.reset();
  showMessage("Mesa creada correctamente.");
  loadMesas();
  updateStats();
}
async function loadMesas(){
  const box=document.getElementById("mesasList");
  box.innerHTML=
    "<div class='empty'>Cargando mesas...</div>";
  const {data,error}=
    await supabaseClient
      .from("mesas")
      .select("*")
      .order("numero",{ascending:true});
  if(error){
    box.innerHTML=
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;
    return;
  }
  if(!data || data.length===0){
    box.innerHTML=
      "<div class='empty'>No hay mesas creadas.</div>";
    return;
  }
  box.innerHTML=data.map(m=>`
    <div class="record">
      <div class="record-title">
        🪑 ${escapeHtml(m.nombre || "Mesa")}
      </div>
      <p><strong>Número:</strong> ${escapeHtml(m.numero)}</p>
      <p><strong>Servicio:</strong> ${escapeHtml(m.servicio || "-")}</p>
      <p><strong>Activa:</strong> ${m.activa ? "Sí":"No"}</p>
      <div class="record-actions">
        <button
          type="button"
          class="delete-button"
          onclick='deleteRecord(
            "mesas",
            ${JSON.stringify(m.id)},
            ${JSON.stringify(m.nombre || "Mesa")},
            loadMesas
          )'
        >
          🗑 ELIMINAR MESA
        </button>
      </div>
    </div>
  `).join("");
}
async function createPromocion(event){
  event.preventDefault();
  const titulo=
    document.getElementById("promoTitulo").value.trim();
  const descripcion=
    document.getElementById("promoDescripcion").value.trim();
  const precio=
    document.getElementById("promoPrecio").value;
  const activa=
    document.getElementById("promoActiva").checked;
  const {error}=
    await supabaseClient
      .from("promociones")
      .insert({
        titulo,
        descripcion,
        precio:precio==="" ? null:Number(precio),
        activa
      });
  if(error){
    showMessage(
      "No se pudo crear la promoción: "+error.message,
      true
    );
    return;
  }
  event.target.reset();
  document.getElementById("promoActiva").checked=true;
  showMessage("Promoción creada correctamente.");
  loadPromociones();
  updateStats();
}
async function loadPromociones(){
  const box=document.getElementById("promocionesList");
  box.innerHTML=
    "<div class='empty'>Cargando promociones...</div>";
  const {data,error}=
    await supabaseClient
      .from("promociones")
      .select("*")
      .order("created_at",{ascending:false});
  if(error){
    box.innerHTML=
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;
    return;
  }
  if(!data || data.length===0){
    box.innerHTML=
      "<div class='empty'>No hay promociones.</div>";
    return;
  }
  box.innerHTML=data.map(p=>`
    <div class="record">
      <div class="record-title">
        🎁 ${escapeHtml(p.titulo)}
      </div>
      <p>${escapeHtml(p.descripcion || "")}</p>
      <p>
        <strong>Precio:</strong>
        ${money(p.precio)}
      </p>
      <p>
        <strong>Activa:</strong>
        ${p.activa ? "Sí":"No"}
      </p>
      <div class="record-actions">
        <button
          type="button"
          class="delete-button"
          onclick='deleteRecord(
            "promociones",
            ${JSON.stringify(p.id)},
            ${JSON.stringify(p.titulo || "Promoción")},
            loadPromociones
          )'
        >
          🗑 ELIMINAR PROMOCIÓN
        </button>
      </div>
    </div>
  `).join("");
}
async function createFoto(event){
  event.preventDefault();
  const titulo=
    document.getElementById("fotoTitulo").value.trim();
  const categoria=
    document.getElementById("fotoCategoria").value.trim();
  const ruta=
    document.getElementById("fotoRuta").value.trim();
  const url=
    document.getElementById("fotoUrl").value.trim();
  const {error}=
    await supabaseClient
      .from("galeria_fotos")
      .insert({
        titulo,
        categoria,
        ruta:ruta || url,
        url
      });
  if(error){
    showMessage(
      "No se pudo agregar la foto: "+error.message,
      true
    );
    return;
  }
  event.target.reset();
  showMessage("Foto agregada correctamente.");
  loadFotos();
  updateStats();
}
async function loadFotos(){
  const box=document.getElementById("fotosList");
  box.innerHTML=
    "<div class='empty'>Cargando fotos...</div>";
  const {data,error}=
    await supabaseClient
      .from("galeria_fotos")
      .select("*")
      .order("creado_en",{ascending:false});
  if(error){
    box.innerHTML=
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;
    return;
  }
  if(!data || data.length===0){
    box.innerHTML=

async function countTable(table){
  const {count,error}=
    await supabaseClient
      .from(table)
      .select("*",{count:"exact",head:true});
  if(error){
    return null;
  }
  return count || 0;
}
async function updateStats(){
  const stats=document.getElementById("stats");
  if(!stats) return;
  const results=await Promise.all([
    countTable("reservas"),
    countTable("mesas"),
    countTable("promociones"),
    countTable("galeria_fotos"),
    countTable("productos"),
    countTable("pedidos"),
    countTable("games"),
    countTable("profiles"),
    countTable("torneos")
  ]);
  const names=[
    "Reservas",
    "Mesas",
    "Promociones",
    "Fotos",
    "Productos",
    "Pedidos",
    "Juegos",
    "Jugadores",
    "Torneos"
  ];
  stats.innerHTML=results.map((value,index)=>`
    <div class="stat">
      <strong>${value===null ? "—":value}</strong>
      ${names[index]}
    </div>
  `).join("");
}
async function refreshAll(){
  await Promise.allSettled([
    loadReservas(),
    loadMesas(),
    loadPromociones(),
    loadFotos(),
    loadProductos(),
    loadPedidos(),
    loadJuegos(),
    loadRanking(),
    loadTorneos(),
    updateStats()
  ]);
}
supabaseClient.auth.onAuthStateChange(
  (event,session)=>{
    if(session){
      document
        .getElementById("loginBox")
        .classList.add("hidden");
      document
        .getElementById("panel")
        .classList.remove("hidden");
    }else{
      document
        .getElementById("loginBox")
        .classList.remove("hidden");
      document
        .getElementById("panel")
        .classList.add("hidden");
    }
  }
);
