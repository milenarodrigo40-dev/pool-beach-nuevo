<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control | Pool & Beach</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#eef7fa;
  color:#123;
  margin:0;
}
header{
  background:#002b40;
  color:white;
  padding:20px;
  text-align:center;
}
header h1{color:#55d8f2}
.container{
  max-width:1100px;
  margin:auto;
  padding:25px 16px;
}
section{
  background:white;
  padding:25px;
  border-radius:18px;
  margin-bottom:25px;
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccdce1;
  border-radius:10px;
  font-size:16px;
  box-sizing:border-box;
  margin-bottom:12px;
}
textarea{
  min-height:90px;
}
button{
  border:0;
  background:#08a6c8;
  color:white;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
.full{
  grid-column:1/-1;
}
.lista{
  margin-top:20px;
  display:grid;
  gap:12px;
}
.reserva{
  border:1px solid #d9e7eb;
  border-radius:14px;
  padding:18px;
  background:#f8fcfd;
}
.mensaje{
  margin-top:15px;
  font-weight:bold;
}
#panel{
  display:none;
}
#login{
  max-width:450px;
  margin:40px auto;
}
#login button{
  width:100%;
}
#logout{
  float:right;
  background:#d9534f;
}
.eliminar{
  background:#d9534f;
  margin-top:8px;
  width:100%;
}
@media(max-width:700px){
  .form{
    grid-template-columns:1fr;
  }
  .full{
    grid-column:auto;
  }
  #logout{
    float:none;
    margin-top:10px;
  }
}
</style>
</head>

<body>

<header>
<button id="logout">Cerrar sesión</button>
<h1>Pool & Beach</h1>
<p>Panel de Control</p>
</header>

<main class="container">

<section id="login">
<h2>🔐 Acceso administrador</h2>

<input id="email" type="email" placeholder="Correo electrónico">

<input id="password" type="password" placeholder="Contraseña">

<button id="loginButton">Ingresar</button>

<div id="loginMensaje" class="mensaje"></div>
</section>


<section id="panel">

<h2>👋 Administración</h2>
<p>Administración de reservas de Pool & Beach.</p>

<a href="admin-juegos.html" style="display:block;background:#087ea4;color:white;text-decoration:none;text-align:center;padding:13px;border-radius:10px;margin:15px 0;font-weight:bold;">
🎮 Juegos, Torneos y Ranking
</a>

<h2>📅 Nueva reserva</h2>

<form id="formReserva" class="form">

<input id="nombre" type="text" placeholder="Nombre del cliente" required>

<input id="telefono" type="tel" placeholder="Teléfono" required>

<input id="fecha" type="date" required>

<input id="hora" type="time" required>

<select id="servicio" required>
<option value="">Elegir servicio</option>
<option value="Pool">🎱 Pool</option>
<option value="PlayStation">🎮 PlayStation</option>
<option value="Simulador">🏎️ Simulador</option>
<option value="Juegos">🎲 Juegos</option>
<option value="Mesa">🍽️ Mesa</option>
</select>

<input id="personas" type="number" min="1" placeholder="Cantidad de personas" required>

<textarea id="notas" class="full" placeholder="Notas de la reserva"></textarea>

<button class="full" type="submit">
➕ Guardar reserva
</button>

</form>

<div id="mensaje" class="mensaje"></div>

<h2 style="margin-top:30px;">📋 Reservas</h2>

<div id="lista" class="lista">
Cargando reservas...
</div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const login = document.getElementById("login");
const panel = document.getElementById("panel");
const loginButton = document.getElementById("loginButton");
const loginMensaje = document.getElementById("loginMensaje");
const logout = document.getElementById("logout");

logout.style.display = "none";


async function iniciarSesion(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){

    loginMensaje.textContent =
      "❌ Completá correo y contraseña.";

    return;
  }

  loginMensaje.textContent = "Ingresando...";

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){

    loginMensaje.textContent =
      "❌ Correo o contraseña incorrectos.";

    console.error(error);

    return;
  }

  mostrarPanel();
}


async function verificarSesion(){

  const { data } =
    await supabaseClient.auth.getSession();

  if(data.session){

    mostrarPanel();

  }else{

    mostrarLogin();

  }
}


function mostrarPanel(){

  login.style.display = "none";
  panel.style.display = "block";
  logout.style.display = "block";

  cargarReservas();
}


function mostrarLogin(){

  login.style.display = "block";
  panel.style.display = "none";
  logout.style.display = "none";
}


loginButton.addEventListener("click", iniciarSesion);


logout.addEventListener("click", async function(){

  await supabaseClient.auth.signOut();

  mostrarLogin();

});


const form = document.getElementById("formReserva");
const lista = document.getElementById("lista");
const mensaje = document.getElementById("mensaje");


async function cargarReservas(){

  lista.innerHTML = "Cargando reservas...";

  const { data, error } =
    await supabaseClient
      .from("reservas")
      .select("*")
      .order("fecha", { ascending:true })
      .order("hora", { ascending:true });

  if(error){

    lista.innerHTML =
      "❌ Error al cargar reservas.";

    console.error(error);

    return;
  }

  if(!data || data.length === 0){

    lista.innerHTML =
      "No hay reservas todavía.";

    return;
  }

  lista.innerHTML = "";

  data.forEach(r => {

    const div = document.createElement("div");

    div.className = "reserva";

    div.innerHTML = `
      <p><strong>👤 Cliente:</strong> ${r.nombre}</p>
      <p><strong>📞 Teléfono:</strong> ${r.telefono || ""}</p>
      <p><strong>📅 Fecha:</strong> ${r.fecha}</p>
      <p><strong>🕐 Hora:</strong> ${r.hora}</p>
      <p><strong>🎮 Servicio:</strong> ${r.servicio}</p>
      <p><strong>👥 Personas:</strong> ${r.cantidad_personas}</p>
      <p><strong>📝 Notas:</strong> ${r.notas || "Sin notas"}</p>

    <label><strong>Estado:</strong></label>

<select onchange="cambiarEstado(${r.id}, this.value)">
  <option value="pendiente" ${r.estado === "pendiente" ? "selected" : ""}>
    Pendiente
  </option>

  <option value="confirmada" ${r.estado === "confirmada" ? "selected" : ""}>
    Confirmada
  </option>

  <option value="cancelada" ${r.estado === "cancelada" ? "selected" : ""}>
    Cancelada
  </option>
</select>

<button class="eliminar" onclick="eliminarReserva(${r.id})">
  🗑️ Eliminar reserva
</button>
    `;

    lista.appendChild(div);

  });

}


async function cambiarEstado(id, estado){

  const { error } =
    await supabaseClient
      .from("reservas")
      .update({ estado: estado })
      .eq("id", id);

  if(error){

    alert("No se pudo cambiar el estado.");

    console.error(error);

    return;
  }

  cargarReservas();
}
async function eliminarReserva(id){
  if(!confirm("¿Seguro que querés eliminar esta reserva?")) return;

  const { error } = await supabaseClient
    .from("reservas")
    .delete()
    .eq("id", id);

  if(error){
    alert("No se pudo eliminar la reserva.");
    console.error(error);
    return;
  }

  cargarReservas();
}

form.addEventListener("submit", async function(e){

  e.preventDefault();

  mensaje.textContent =
    "Guardando reserva...";

  const reserva = {

    nombre:
      document.getElementById("nombre").value.trim(),

    telefono:
      document.getElementById("telefono").value.trim(),

    fecha:
      document.getElementById("fecha").value,

    hora:
      document.getElementById("hora").value,

    servicio:
      document.getElementById("servicio").value,

    cantidad_personas:
      Number(document.getElementById("personas").value),

    notas:
      document.getElementById("notas").value.trim()

  };


  const { error } =
    await supabaseClient
      .from("reservas")
      .insert([reserva]);


  if(error){

    mensaje.textContent =
      "❌ Error: " + error.message;

    return;
  }


  mensaje.textContent =
    "✅ Reserva guardada correctamente.";

  form.reset();

  cargarReservas();

});


verificarSesion();

</script>

</body>
</html>
