<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool & Beach | Administración</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #e0f2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    h1 {
      margin: 0;
      text-align: center;
      color: #0284c7;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      margin: 8px 0 25px;
    }
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #334155;
    }
    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #0284c7;
    }
    #loginButton {
      display: block;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    #loginButton:disabled {
      opacity: .7;
    }
    #mensaje {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      min-height: 18px;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
    }
    .success {
      background: #dcfce7;
      color: #166534;
    }
    /* PANEL */
    #panel {
      position: fixed;
      inset: 0;
      overflow-y: auto;
      background: #f1f5f9;
    }
    .header {
      background: #0284c7;
      color: white;
      padding: 18px 20px;
    }
    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .header h1 {
      color: white;
      text-align: left;
      font-size: 24px;
    }
    .header p {
      margin: 5px 0 0;
      font-size: 14px;
    }
    #logoutButton {
      width: auto;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: #dc2626;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .content {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px;
    }
    .welcome {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    .welcome h2 {
      margin-top: 0;
      color: #0284c7;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    .card-title {
      color: #64748b;
      font-size: 14px;
    }
    .card-number {
      margin-top: 8px;
      color: #0284c7;
      font-size: 30px;
      font-weight: bold;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .card {
        padding: 15px;
      }
      .header-content {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <!-- =========================
       LOGIN
       ========================= -->
  <div id="loginBox" class="login-box">
    <h1>🏖️ Pool & Beach</h1>
    <p class="subtitle">
      Panel de administración
    </p>
    <form id="loginForm" onsubmit="iniciarSesion(event)">
      <label for="email">
        Correo electrónico
      </label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Ingresá tu correo"
        required
      >
      <label for="password">
        Contraseña
      </label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Ingresá tu contraseña"
        required
      >
      <button
        id="loginButton"
        type="submit"
      >
        Iniciar sesión
      </button>
      <div id="mensaje"></div>
    </form>
  </div>
  <!-- =========================
       PANEL
       ========================= -->
  <div id="panel" class="hidden">
    <header class="header">
      <div class="header-content">
        <div>
          <h1>🏖️ Pool & Beach</h1>
          <p>Panel de administración</p>
        </div>
        <button
          id="logoutButton"
          onclick="cerrarSesion()"
        >
          Cerrar sesión
        </button>
      </div>
    </header>
    <main class="content">
      <div class="welcome">
        <h2>Panel de administración</h2>
        <p>
          ¡Inicio de sesión correcto!
        </p>
        <div class="cards">
          <div class="card">
            <div class="card-title">
              Reservas
            </div>
            <div
              id="reservasCount"
              class="card-number"
            >
              0
            </div>
          </div>
          <div class="card">
            <div class="card-title">
              Mesas
            </div>
            <div
              id="mesasCount"
              class="card-number"
            >
              0
            </div>
          </div>
          <div class="card">
            <div class="card-title">
              Fotos
            </div>
            <div
              id="fotosCount"
              class="card-number"
            >
              0
            </div>
          </div>
          <div class="card">
            <div class="card-title">
              Estado
            </div>
            <div
              class="card-number"
              style="font-size:22px;"
            >
              ACTIVO
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    /* =====================================
       SUPABASE
       ===================================== */
    const SUPABASE_URL =
      "https://nmpakeovqkdajtswjpgm.supabase.co";
    const SUPABASE_ANON_KEY =
      "sb_publishable_FyuFdiW_2eXNScLd9MShng_rLxxztsu";
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false
          }
        }
      );
    /* =====================================
       MOSTRAR PANEL
       ===================================== */
    function mostrarPanel() {
      document
        .getElementById("loginBox")
        .classList.add("hidden");
      document
        .getElementById("panel")
        .classList.remove("hidden");
      cargarContadores();
    }
    /* =====================================
       MOSTRAR LOGIN
       ===================================== */
    function mostrarLogin() {
      document
        .getElementById("panel")
        .classList.add("hidden");
      document
        .getElementById("loginBox")
        .classList.remove("hidden");
    }
    /* =====================================
       MENSAJE
       ===================================== */
    function mensaje(texto, tipo) {
      const elemento =
        document.getElementById("mensaje");
      elemento.textContent = texto;
      elemento.className = tipo || "";
    }
    /* =====================================
       INICIAR SESIÓN
       ===================================== */
    async function iniciarSesion(event) {
      event.preventDefault();
      const email =
        document
          .getElementById("email")
          .value
          .trim();
      const password =
        document
          .getElementById("password")
          .value;
      const button =
        document.getElementById("loginButton");
      if (!email || !password) {
        mensaje(
          "Completá los dos campos.",
          "error"
        );
        return false;
      }
      button.disabled = true;
      button.textContent = "Ingresando...";
      mensaje("", "");
      try {
        const respuesta =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });
        console.log(
          "Resultado Supabase:",
          respuesta
        );
        if (respuesta.error) {
          mensaje(
            respuesta.error.message,
            "error"
          );
          button.disabled = false;
          button.textContent =
            "Iniciar sesión";
          return false;
        }
        if (
          respuesta.data &&
          respuesta.data.session
        ) {
          mensaje(
            "Inicio de sesión correcto.",
            "success"
          );
          /*
           * Guardamos la sesión explícitamente
           * y mostramos el panel.
           */
          localStorage.setItem(
            "pool_beach_admin",
            "true"
          );
          mostrarPanel();
        } else {
          mensaje(
            "No se recibió una sesión de Supabase.",
            "error"
          );
        }
      } catch (error) {
        console.error(error);
        mensaje(
          "Error de conexión con Supabase.",
          "error"
        );
      }
      button.disabled = false;
      button.textContent =
        "Iniciar sesión";
      return false;
    }
    /* =====================================
       CERRAR SESIÓN
       ===================================== */
    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      localStorage.removeItem(
        "pool_beach_admin"
      );
      document.getElementById(
        "password"
      ).value = "";
      mostrarLogin();
    }
    /* =====================================
       SESIÓN AL ABRIR
       ===================================== */
    async function comprobarSesion() {
      try {
        const respuesta =
          await supabaseClient.auth.getSession();
        if (
          respuesta.data &&
          respuesta.data.session
        ) {
          mostrarPanel();
        } else {
          mostrarLogin();
        }
      } catch (error) {
        console.error(error);
        mostrarLogin();
      }
    }
    /* =====================================
       CONTADORES
       ===================================== */
    async function cargarContadores() {
      try {
        const reservas =
          await supabaseClient
            .from("reservas")
            .select("*", {
              count: "exact",
              head: true
            });
        const mesas =
          await supabaseClient
            .from("mesas")
            .select("*", {
              count: "exact",
              head: true
            });
        const fotos =
          await supabaseClient
            .from("galeria_fotos")
            .select("*", {
              count: "exact",
              head: true
            });
        if (!reservas.error) {
          document.getElementById(
            "reservasCount"
          ).textContent =
            reservas.count || 0;
        }
        if (!mesas.error) {
          document.getElementById(
            "mesasCount"
          ).textContent =
            mesas.count || 0;
        }
        if (!fotos.error) {
          document.getElementById(
            "fotosCount"
          ).textContent =
            fotos.count || 0;
        }
      } catch (error) {
        console.error(
          "Error cargando datos:",
          error
        );
      }
    }
    /* =====================================
       INICIAR
       ===================================== */
    document.addEventListener(
      "DOMContentLoaded",
      function() {
        comprobarSesion();
      }
    );
  </script>
</body>
</html>
