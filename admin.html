<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control | Pool & Beach</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#eef7fa;
  color:#123;
  margin:0;
}
header{
  background:#002b40;
  color:white;
  padding:20px;
  text-align:center;
}
header h1{color:#55d8f2}
.container{
  max-width:1100px;
  margin:auto;
  padding:25px 16px;
}
section{
  background:white;
  padding:25px;
  border-radius:18px;
  margin-bottom:25px;
}
.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccdce1;
  border-radius:10px;
  font-size:16px;
  box-sizing:border-box;
}
textarea{
  min-height:90px;
}
.full{
  grid-column:1/-1;
}
button{
  border:0;
  background:#08a6c8;
  color:white;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
  font-size:16px;
}
.lista{
  margin-top:20px;
  display:grid;
  gap:12px;
}
.reserva{
  border:1px solid #d9e7eb;
  border-radius:14px;
  padding:18px;
  background:#f8fcfd;
}
.estado{
  display:inline-block;
  margin-top:8px;
  padding:6px 10px;
  border-radius:15px;
  background:#dff7e8;
  color:#17733d;
  font-weight:bold;
}
.mensaje{
  margin-top:15px;
  font-weight:bold;
}
@media(max-width:700px){
  .form{
    grid-template-columns:1fr;
  }
  .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header>
<h1>Pool & Beach</h1>
<p>Panel de Control</p>
</header>

<main class="container">

<section>
<h2>👋 Administración</h2>
<p>Administración de reservas de Pool & Beach.</p>
</section>

<section>

<h2>📅 Nueva reserva</h2>

<form id="formReserva" class="form">

<input id="nombre" type="text" placeholder="Nombre del cliente" required>

<input id="telefono" type="tel" placeholder="Teléfono" required>

<input id="fecha" type="date" required>

<input id="hora" type="time" required>

<select id="servicio" required>
<option value="">Elegir servicio</option>
<option value="Pool">🎱 Pool</option>
<option value="PlayStation">🎮 PlayStation</option>
<option value="Simulador">🏎️ Simulador</option>
<option value="Juegos">🎲 Juegos</option>
<option value="Mesa">🍽️ Mesa</option>
</select>

<input id="personas" type="number" min="1" placeholder="Cantidad de personas" required>

<textarea id="notas" class="full" placeholder="Notas de la reserva"></textarea>

<button class="full" type="submit">
➕ Guardar reserva
</button>

</form>

<div id="mensaje" class="mensaje"></div>

<h2 style="margin-top:30px;">📋 Reservas</h2>

<div id="lista" class="lista">
Cargando reservas...
</div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const form = document.getElementById("formReserva");
const lista = document.getElementById("lista");
const mensaje = document.getElementById("mensaje");

async function cargarReservas(){

  lista.innerHTML = "Cargando reservas...";

  const { data, error } =
    await supabaseClient
      .from("reservas")
      .select("*")
      .order("fecha", { ascending:true })
      .order("hora", { ascending:true });

  if(error){
    console.error(error);
    lista.innerHTML = "❌ Error al cargar las reservas.";
    return;
  }

  if(!data || data.length === 0){
    lista.innerHTML = "No hay reservas todavía.";
    return;
  }

  lista.innerHTML = "";

  data.forEach(r => {

    const div = document.createElement("div");

    div.className = "reserva";

    div.innerHTML = `
      <p><strong>👤 Cliente:</strong> ${r.nombre}</p>
      <p><strong>📞 Teléfono:</strong> ${r.telefono || ""}</p>
      <p><strong>📅 Fecha:</strong> ${r.fecha}</p>
      <p><strong>🕐 Hora:</strong> ${r.hora}</p>
      <p><strong>🎮 Servicio:</strong> ${r.servicio}</p>
      <p><strong>👥 Personas:</strong> ${r.cantidad_personas}</p>
      <p><strong>📝 Notas:</strong> ${r.notas || "Sin notas"}</p>
      <span class="estado">${r.estado}</span>
    `;

    lista.appendChild(div);

  });

}


form.addEventListener("submit", async function(e){

  e.preventDefault();

  mensaje.textContent = "Guardando reserva...";

  const reserva = {

    nombre:
      document.getElementById("nombre").value.trim(),

    telefono:
      document.getElementById("telefono").value.trim(),

    fecha:
      document.getElementById("fecha").value,

    hora:
      document.getElementById("hora").value,

    servicio:
      document.getElementById("servicio").value,

    cantidad_personas:
      Number(document.getElementById("personas").value),

    notas:
      document.getElementById("notas").value.trim()

  };


  const { error } =
    await supabaseClient
      .from("reservas")
      .insert([reserva]);


  if(error){

    console.error(error);

    mensaje.textContent =
      "❌ Error: " + error.message;

    return;
  }


  mensaje.textContent =
    "✅ Reserva guardada correctamente.";

  form.reset();

  cargarReservas();

});


cargarReservas();

</script>

</body>
</html>
