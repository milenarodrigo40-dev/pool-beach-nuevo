<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Control | Pool & Beach</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f9;
  color:#17202a;
}
header{
  background:#071d2b;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:24px;
}
header p{
  margin:6px 0 0;
  opacity:.8;
}
.container{
  width:min(1100px,94%);
  margin:20px auto;
}
.login{
  max-width:430px;
  margin:50px auto;
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}
input,select,textarea,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:9px;
  border:1px solid #ccd5db;
  font-size:15px;
}
textarea{
  min-height:90px;
  resize:vertical;
}
button{
  background:#087ea4;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
button:hover{
  opacity:.9;
}
button.danger{
  background:#d62828;
  width:auto;
  padding:10px 16px;
  margin:0;
}
button.secondary{
  background:#52616b;
}
.hidden{
  display:none!important;
}
.message{
  margin:10px 0;
  padding:12px;
  border-radius:9px;
  background:#dff6e9;
  color:#146c43;
}
.message.error{
  background:#ffe1e1;
  color:#a61b1b;
}
nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
}
nav button{
  width:auto;
  background:#0b3447;
  padding:10px 14px;
}
nav button.active{
  background:#087ea4;
}
.section{
  display:none;
}
.section.active{
  display:block;
}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}
.card h2{
  margin-top:0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:12px;
}
.record{
  border:1px solid #dce3e7;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
  background:#fafcfd;
}
.record-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}
.record-title{
  font-size:17px;
  font-weight:bold;
}
.record p{
  margin:7px 0;
}
.empty{
  padding:20px;
  text-align:center;
  color:#6b7780;
}
.logout{
  background:#9b2226;
  width:auto;
  padding:10px 18px;
}
.small{
  font-size:13px;
  color:#667;
}
.delete-area{
  margin-top:15px;
  padding-top:13px;
  border-top:1px solid #e1e6e9;
  text-align:right;
}
.delete-area button{
  background:#d62828!important;
  color:white!important;
  display:inline-block!important;
  visibility:visible!important;
  opacity:1!important;
}
.delete-label{
  color:#9b2226;
  font-size:12px;
  font-weight:bold;
  margin-right:10px;
}
@media(max-width:600px){
  .record-header{
    flex-direction:column;
  }
  .delete-area{
    text-align:stretch;
  }
  .delete-area button{
    width:100%!important;
  }
  .delete-label{
    display:block;
    margin:0 0 6px 0;
  }
}
</style>
</head>
<body>
<header>
  <h1>Pool & Beach</h1>
  <p>Panel de Administración</p>
</header>
<div class="container">
<!-- LOGIN -->
<div id="loginBox" class="login">
  <h2>Iniciar sesión</h2>

<input
id=“email”
type=“email”
placeholder=“Correo electrónico”
autocomplete=“email”

<input
id=“password”
type=“password”
placeholder=“Contraseña”
autocomplete=“current-password”

  <button onclick="login()">
    INICIAR SESIÓN
  </button>
  <div id="loginMessage"></div>
</div>
<!-- PANEL -->
<div id="panel" class="hidden">
  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
  ">
<strong>Panel de control</strong>
<button
  class="logout"
  onclick="logout()"
>
  Cerrar sesión
</button>
  </div>
  <!-- NAVEGACIÓN -->
  <nav>
<button onclick="showSection('reservas',this)">
  Reservas
</button>
<button onclick="showSection('mesas',this)">
  Mesas
</button>
<button onclick="showSection('promociones',this)">
  Promociones
</button>
<button onclick="showSection('fotos',this)">
  Fotos
</button>
<button onclick="showSection('productos',this)">
  Productos
</button>
<button onclick="showSection('pedidos',this)">
  Pedidos
</button>
<button onclick="showSection('juegos',this)">
  Juegos
</button>
<button onclick="showSection('ranking',this)">
  Ranking
</button>
<button onclick="showSection('torneos',this)">
  Torneos
</button>
  </nav>
  <div id="globalMessage"></div>
  <!-- =========================
       RESERVAS
  ========================== -->
  <section id="reservas" class="section">
<div class="card">
  <h2>Reservas</h2>
  <button onclick="loadReservas()">
    Actualizar reservas
  </button>
  <div id="reservasList"></div>
</div>
  </section>
  <!-- =========================
       MESAS
  ========================== -->
  <section id="mesas" class="section">
<div class="card">
  <h2>Mesas</h2>
  <form onsubmit="createMesa(event)">
    <div class="grid">
      <input
        id="mesaNumero"
        type="number"
        placeholder="Número de mesa"
        required
      >
      <input
        id="mesaNombre"
        type="text"
        placeholder="Nombre de mesa"
      >
      <input
        id="mesaServicio"
        type="text"
        placeholder="Servicio"
      >
    </div>
    <button type="submit">
      Agregar mesa
    </button>
  </form>
  <hr>
  <div id="mesasList"></div>
</div>
  </section>
  <!-- =========================
       PROMOCIONES
  ========================== -->
  <section id="promociones" class="section">
<div class="card">
  <h2>Promociones</h2>
  <form onsubmit="createPromocion(event)">
    <input
      id="promoTitulo"
      type="text"
      placeholder="Título"
      required
    >
    <textarea
      id="promoDescripcion"
      placeholder="Descripción"
    ></textarea>
    <input
      id="promoPrecio"
      type="number"
      step="0.01"
      placeholder="Precio"
    >
    <label>
      <input
        id="promoActiva"
        type="checkbox"
        checked
        style="width:auto;"
      >
      Promoción activa
    </label>
    <button type="submit">
      Agregar promoción
    </button>
  </form>
  <hr>
  <div id="promocionesList"></div>
</div>
  </section>
  <!-- =========================
       FOTOS
  ========================== -->
  <section id="fotos" class="section">
<div class="card">
  <h2>Fotos</h2>
  <form onsubmit="createFoto(event)">
    <input
      id="fotoTitulo"
      type="text"
      placeholder="Título"
      required
    >
    <input
      id="fotoCategoria"
      type="text"
      placeholder="Categoría"
    >
    <input
      id="fotoRuta"
      type="text"
      placeholder="Ruta"
    >
    <input
      id="fotoUrl"
      type="url"
      placeholder="URL de la imagen"
      required
    >
    <button type="submit">
      Agregar foto
    </button>
  </form>
  <hr>
  <div id="fotosList"></div>
</div>
  </section>
  <!-- =========================
       PRODUCTOS
  ========================== -->
  <section id="productos" class="section">
<div class="card">
  <h2>Productos</h2>
  <form onsubmit="createProducto(event)">
    <input
      id="productoNombre"
      type="text"
      placeholder="Nombre"
      required
    >
    <input
      id="productoCategoria"
      type="text"
      placeholder="Categoría"
    >
    <textarea
      id="productoDescripcion"
      placeholder="Descripción"
    ></textarea>
    <input
      id="productoPrecio"
      type="number"
      step="0.01"
      placeholder="Precio"
    >
    <label>
      <input
        id="productoDisponible"
        type="checkbox"
        checked
        style="width:auto;"
      >
      Disponible
    </label>
    <button type="submit">
      Agregar producto
    </button>
  </form>
  <hr>
  <div id="productosList"></div>
</div>
  </section>
  <!-- =========================
       PEDIDOS
  ========================== -->
  <section id="pedidos" class="section">
<div class="card">
  <h2>Pedidos</h2>
  <button onclick="loadPedidos()">
    Actualizar pedidos
  </button>
  <div id="pedidosList"></div>
</div>
  </section>
  <!-- =========================
       JUEGOS
  ========================== -->
  <section id="juegos" class="section">
<div class="card">
  <h2>Juegos</h2>
  <form onsubmit="createJuego(event)">
    <input
      id="juegoNombre"
      type="text"
      placeholder="Nombre del juego"
      required
    >
    <textarea
      id="juegoDescripcion"
      placeholder="Descripción"
    ></textarea>
    <input
      id="juegoIcono"
      type="text"
      placeholder="Icono"
    >
    <input
      id="juegoPuntos"
      type="number"
      placeholder="Puntos"
      value="0"
    >
    <input
      id="juegoTokens"
      type="number"
      placeholder="Tokens"
      value="0"
    >
    <label>
      <input
        id="juegoActivo"
        type="checkbox"
        checked
        style="width:auto;"
      >
      Juego activo
    </label>
    <button type="submit">
      Agregar juego
    </button>
  </form>
  <hr>
  <div id="juegosList"></div>
</div>
  </section>
  <!-- =========================
       RANKING
  ========================== -->
  <section id="ranking" class="section">
<div class="card">
  <h2>Ranking</h2>
  <button onclick="loadRanking()">
    Actualizar ranking
  </button>
  <div id="rankingList"></div>
</div>
  </section>
  <!-- =========================
       TORNEOS
  ========================== -->
  <section id="torneos" class="section">
<div class="card">
  <h2>Torneos</h2>
  <form onsubmit="createTorneo(event)">
    <input
      id="torneoNombre"
      type="text"
      placeholder="Nombre del torneo"
      required
    >
    <input
      id="torneoJuego"
      type="text"
      placeholder="Juego"
      required
    >
    <input
      id="torneoFecha"
      type="date"
    >
    <input
      id="torneoInscripcion"
      type="number"
      step="0.01"
      placeholder="Inscripción"
    >
    <input
      id="torneoPremio1"
      type="number"
      step="0.01"
      placeholder="Premio 1°"
    >
    <input
      id="torneoPremio2"
      type="number"
      step="0.01"
      placeholder="Premio 2°"
    >
    <input
      id="torneoMax"
      type="number"
      placeholder="Máximo de participantes"
    >
    <input
      id="torneoEstado"
      type="text"
      placeholder="Estado"
      value="abierto"
    >
    <textarea
      id="torneoNotas"
      placeholder="Notas"
    ></textarea>
    <button type="submit">
      Agregar torneo
    </button>
  </form>
  <hr>
  <div id="torneosList"></div>
</div>
  </section>
</div>
</div>
<script>
/* =========================
   SUPABASE
========================= */
const SUPABASE_URL =
  "https://nmpakeovqkdajtswjpgm.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_FyuFdiW_2eXNScLd9MShng_rLxxztsu";
const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
/* =========================
   MENSAJES
========================= */
function showMessage(text,error=false){
  const box =
    document.getElementById("globalMessage");
  box.innerHTML =
    `<div class="message ${error ? "error" : ""}">
      ${escapeHtml(text)}
    </div>`;
  setTimeout(()=>{
    box.innerHTML="";
  },5000);
}
function showLoginMessage(text,error=false){
  const box =
    document.getElementById("loginMessage");
  box.innerHTML =
    `<div class="message ${error ? "error" : ""}">
      ${escapeHtml(text)}
    </div>`;
}
/* =========================
   SEGURIDAD
========================= */
function escapeHtml(value){
  if(value===null || value===undefined){
    return "";
  }
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
/* =========================
   LOGIN
========================= */
async function login(){
  const email =
    document.getElementById("email").value.trim();
  const password =
    document.getElementById("password").value;
  if(!email || !password){
    showLoginMessage(
      "Completá correo y contraseña.",
      true
    );
    return;
  }
  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });
  if(error){
    console.error(error);
    showLoginMessage(
      "No se pudo iniciar sesión: " +
      error.message,
      true
    );
    return;
  }
  showPanel();
}
/* =========================
   PANEL / SESIÓN
========================= */
async function showPanel(){
  document
    .getElementById("loginBox")
    .classList.add("hidden");
  document
    .getElementById("panel")
    .classList.remove("hidden");
  const firstButton =
    document.querySelector("nav button");
  showSection(
    "reservas",
    firstButton
  );
  refreshAll();
}
async function logout(){
  await supabaseClient.auth.signOut();
  document
    .getElementById("panel")
    .classList.add("hidden");
  document
    .getElementById("loginBox")
    .classList.remove("hidden");
}
async function checkSession(){
  const {
    data
  } =
    await supabaseClient.auth.getSession();
  if(data && data.session){
    showPanel();
  }
}
/* =========================
   NAVEGACIÓN
========================= */
function showSection(id,button){
  document
    .querySelectorAll(".section")
    .forEach(section=>{
      section.classList.remove("active");
    });
  const section =
    document.getElementById(id);
  if(section){
    section.classList.add("active");
  }
  document
    .querySelectorAll("nav button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });
  if(button){
    button.classList.add("active");
  }
}
/* =========================
   ELIMINAR
========================= */
async function deleteRecord(
  table,
  id,
  nombre,
  reloadFunction
){
  const confirmar =
    confirm(
      "¿Seguro que querés eliminar \"" +
      nombre +
      "\"?\n\n" +
      "Esta acción no se puede deshacer."
    );
  if(!confirmar){
    return;
  }
  showMessage("Eliminando...");
  const {
    error
  } =
    await supabaseClient
      .from(table)
      .delete()
      .eq("id",id);
  if(error){
    console.error(
      "Error eliminando:",
      table,
      error
    );
    showMessage(
      "No se pudo eliminar: " +
      error.message,
      true
    );
    return;
  }
  showMessage(
    "Registro eliminado correctamente."
  );
  if(typeof reloadFunction === "function"){
    await reloadFunction();
  }
}
/* =========================
   RESERVAS
========================= */
async function loadReservas(){
  const box =
    document.getElementById("reservasList");
  box.innerHTML =
    "<p>Cargando...</p>";
  const {
    data,
    error
  } =
    await supabaseClient
      .from("reservas")
      .select("*")
      .order("fecha",{ascending:false})
      .order("hora",{ascending:false});
  if(error){
    box.innerHTML =
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;
    return;
  }
  if(!data || data.length===0){
    box.innerHTML =
      `<div class="empty">
        No hay reservas.
      </div>`;
    return;
  }
  box.innerHTML =
    data.map(r=>`
      <div class="record">
        <div class="record-title">
          ${escapeHtml(r.nombre || "Sin nombre")}
        </div>
        <p>
          <strong>Fecha:</strong>
          ${escapeHtml(r.fecha || "-")}
        </p>
        <p>
          <strong>Hora:</strong>
          ${escapeHtml(r.hora || "-")}
        </p>
        <p>
          <strong>Teléfono:</strong>
          ${escapeHtml(r.telefono || "-")}
        </p>
        <p>
          <strong>Servicio:</strong>
          ${escapeHtml(r.servicio || "-")}
        </p>
        <p>
          <strong>Personas:</strong>
          ${escapeHtml(r.cantidad_personas || "-")}
        </p>
        <p>
          <strong>Estado:</strong>
          ${escapeHtml(r.estado || "-")}
        </p>
        <p>
          <strong>Notas:</strong>
          ${escapeHtml(r.notas || "-")}
        </p>
        <div class="delete-area">
          <span class="delete-label">
            ADMINISTRACIÓN
          </span>
          <button
            class="danger"
            onclick='deleteRecord(
              "reservas",
              "${r.id}",
              ${JSON.stringify(r.nombre || "esta reserva")},
              loadReservas
            )'
          >
            🗑 ELIMINAR
          </button>
        </div>
      </div>
    `).join("");
}
/* =========================
   MESAS
========================= */
async function createMesa(event){
  event.preventDefault();
  const numero =
    document.getElementById("mesaNumero").value;
  const nombre =
    document.getElementById("mesaNombre").value.trim();
  const servicio =
    document.getElementById("mesaServicio").value.trim();
  const {
    error
  } =
    await supabaseClient
      .from("mesas")
      .insert({
        numero:Number(numero),
        nombre:nombre || null,
        servicio:servicio || null,
        activa:true
      });
  if(error){
    showMessage(
      "No se pudo crear la mesa: " +
      error.message,
      true
    );
    return;
  }
  event.target.reset();
  showMessage(
    "Mesa agregada correctamente."
  );
  loadMesas();
}
async function loadMesas(){
  const box =
    document.getElementById("mesasList");
  const {
    data,
    error
  } =
    await supabaseClient
      .from("mesas")
      .select("*")
      .order("numero",{ascending:true});
  if(error){
    box.innerHTML =
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;
    return;
  }
  if(!data || data.length===0){
    box.innerHTML =
      `<div class="empty">
        No hay mesas cargadas.
      </div>`;
    return;
  }
  box.innerHTML =
    data.map(m=>`
      <div class="record">
        <div class="record-title">
          Mesa ${escapeHtml(m.numero)}
        </div>
        <p>
          <strong>Nombre:</strong>
          ${escapeHtml(m.nombre || "-")}
        </p>
        <p>
          <strong>Servicio:</strong>
          ${escapeHtml(m.servicio || "-")}
        </p>
        <p>
          <strong>Activa:</strong>
          ${m.activa ? "Sí" : "No"}
        </p>
        <div class="delete-area">
          <span class="delete-label">
            ADMINISTRACIÓN
          </span>
          <button
            class="danger"
            onclick='deleteRecord(
              "mesas",
              "${m.id}",
              ${JSON.stringify("Mesa " + m.numero)},
              loadMesas
            )'
          >
            🗑 ELIMINAR
          </button>
        </div>
      </div>
    `).join("");
}
/* =========================
   PROMOCIONES
========================= */
async function createPromocion(event){
  event.preventDefault();
  const titulo =
    document
      .getElementById("promoTitulo")
      .value
      .trim();
  const descripcion =
    document
      .getElementById("promoDescripcion")
      .value
      .trim();
  const precioValue =
    document
      .getElementById("promoPrecio")
      .value;
  const activa =
    document
      .getElementById("promoActiva")
      .checked;
  const {
    error
  } =
    await supabaseClient
      .from("promociones")
      .insert({
        titulo,
        descripcion:
          descripcion || null,
        precio:
          precioValue === ""
            ? null
            : Number(precioValue),
        activa
      });
  if(error){
    showMessage(
      "No se pudo crear la promoción: " +
      error.message,
      true
    );
    return;
  }
  event.target.reset();
  document
    .getElementById("promoActiva")
    .checked=true;
  showMessage(
    "Promoción agregada correctamente."
  );
  loadPromociones();
}
async function loadPromociones(){
  const box =
    document.getElementById(
      "promocionesList"
    );
  const {
    data,
    error
  } =
    await supabaseClient
      .from("promociones")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );
  if(error){
    box.innerHTML =
      `<div class="message error">
        ${escapeHtml(error.message)}
      </div>`;
    return;
  }
  if(!data || data.length===0){
    box.innerHTML =
      `<div class="empty">
        No hay promociones.
      </div>`;
    return;
  }
  box.innerHTML =
    data.map(p=>`
      <div class="record">
        <div class="record-title">
          ${escapeHtml(p.titulo)}
        </div>
        <p>
          ${escapeHtml(
            p.descripcion || ""
          )}
        </p>
        <p>
          <strong>Precio:</strong>
          ${
            p.precio !== null
              ? "$" + escapeHtml(p.precio)
              : "-"
          }
        </p>
        <p>
          <strong>Activa:</strong>
          ${p.activa ? "Sí" : "No"}
        </p>
        <div class="delete-area">
