<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool & Beach - Administración</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #e0f2fe;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    h1 {
      text-align: center;
      color: #0284c7;
      margin-bottom: 8px;
    }
    p {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      display: block;
      width: 100%;
      padding: 15px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
    #mensaje {
      margin-top: 15px;
      text-align: center;
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="login">
    <h1>🏖️ Pool & Beach</h1>
    <p>Panel de administración</p>
    <form id="loginForm">
      <label for="email">
        Correo electrónico
      </label>
      <input
        type="email"
        id="email"
        placeholder="Ingresá tu correo"
        required
      >
      <label for="password">
        Contraseña
      </label>
      <input
        type="password"
        id="password"
        placeholder="Ingresá tu contraseña"
        required
      >
      <button type="submit">
        Iniciar sesión
      </button>
      <div id="mensaje"></div>
    </form>
  </div>
</body>
</html>
