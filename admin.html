<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool & Beach | Administración</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #e0f2fe;
      color: #0f172a;
    }
    .hidden {
      display: none !important;
    }
    /* LOGIN */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    h1 {
      margin: 0;
      text-align: center;
      color: #0284c7;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      margin: 8px 0 25px;
    }
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #334155;
    }
    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }
    input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2,132,199,.12);
    }
    #loginButton {
      display: block;
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    #loginButton:disabled {
      opacity: .65;
      cursor: wait;
    }
    #mensaje {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      min-height: 18px;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
    }
    .success {
      background: #dcfce7;
      color: #166534;
    }
    /* PANEL */
    #adminPanel {
      min-height: 100vh;
      background: #f1f5f9;
    }
    .topbar {
      background: #0284c7;
      color: #fff;
      padding: 18px 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }
    .topbar-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .topbar h1 {
      color: #fff;
      text-align: left;
      font-size: 24px;
    }
    .topbar p {
      margin: 5px 0 0;
      font-size: 14px;
    }
    #logoutButton {
      width: auto;
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: #dc2626;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .content {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px;
    }
    .welcome {
      background: #fff;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    .welcome h2 {
      margin-top: 0;
      color: #0284c7;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: #fff;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }
    .card-title {
      color: #64748b;
      font-size: 14px;
    }
    .card-number {
      margin-top: 8px;
      color: #0284c7;
      font-size: 30px;
      font-weight: bold;
    }
    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .card {
        padding: 15px;
      }
      .card-number {
        font-size: 25px;
      }
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <section id="loginScreen">
    <div class="login-box">
      <h1>🏖️ Pool & Beach</h1>
      <p class="subtitle">
        Panel de administración
      </p>
      <form id="loginForm">
        <label for="email">
          Correo electrónico
        </label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="Ingresá tu correo"
          required
        >
        <label for="password">
          Contraseña
        </label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Ingresá tu contraseña"
          required
        >
        <button
          id="loginButton"
          type="submit"
          disabled
        >
          Iniciar sesión
        </button>
        <div id="mensaje"></div>
      </form>
    </div>
  </section>
  <!-- PANEL -->
  <section id="adminPanel" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <h1>🏖️ Pool & Beach</h1>
          <p>Panel de administración</p>
        </div>
        <button
          id="logoutButton"
          type="button"
        >
          Cerrar sesión
        </button>
      </div>
    </header>
    <main class="content">
      <div class="welcome">
        <h2>Panel de administración</h2>
        <p>
          ¡Inicio de sesión correcto!
        </p>
        <div class="cards">
          <div class="card">
            <div class="card-title">
              Reservas
            </div>
            <div
              id="reservasCount"
              class="card-number"
            >
              0
            </div>
          </div>
          <div class="card">
            <div class="card-title">
              Mesas
            </div>
            <div
              id="mesasCount"
              class="card-number"
            >
              0
            </div>
          </div>
          <div class="card">
            <div class="card-title">
              Fotos
            </div>
            <div
              id="fotosCount"
              class="card-number"
            >
              0
            </div>
          </div>
          <div class="card">
            <div class="card-title">
              Estado
            </div>
            <div
              class="card-number"
              style="font-size:22px;"
            >
              ACTIVO
            </div>
          </div>
        </div>
      </div>
    </main>
  </section>
  <script>
    /* =====================================
       SUPABASE
       ===================================== */
    const SUPABASE_URL =
      "https://nmpakeovqkdajtswjpgm.supabase.co";
    const SUPABASE_ANON_KEY =
      "sb_publishable_FyuFdiW_2eXNScLd9MShng_rLxxztsu";
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: false
          }
        }
      );
    /* =====================================
       ELEMENTOS
       ===================================== */
    const loginScreen =
      document.getElementById("loginScreen");
    const adminPanel =
      document.getElementById("adminPanel");
    const loginForm =
      document.getElementById("loginForm");
    const loginButton =
      document.getElementById("loginButton");
    const logoutButton =
      document.getElementById("logoutButton");
    const mensajeElemento =
      document.getElementById("mensaje");
    /* =====================================
       CONTROL DE INICIALIZACIÓN
       ===================================== */
    let sistemaListo = false;
    /* =====================================
       MENSAJE
       ===================================== */
    function mostrarMensaje(texto, tipo) {
      mensajeElemento.textContent = texto;
      mensajeElemento.className = tipo || "";
    }
    /* =====================================
       MOSTRAR LOGIN
       ===================================== */
    function mostrarLogin() {
      adminPanel.classList.add("hidden");
      loginScreen.classList.remove("hidden");
    }
    /* =====================================
       MOSTRAR PANEL
       ===================================== */
    function mostrarPanel() {
      loginScreen.classList.add("hidden");
      adminPanel.classList.remove("hidden");
      cargarContadores();
    }
    /* =====================================
       INICIAR SESIÓN
       ===================================== */
    loginForm.addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();
        /*
         * Esperamos a que termine la comprobación
         * inicial. Esto evita que esa comprobación
         * pueda devolvernos al login después de
         * haber iniciado sesión.
         */
        if (!sistemaListo) {
          mostrarMensaje(
            "Esperá un momento e intentá nuevamente.",
            "error"
          );
          return;
        }
        const email =
          document
            .getElementById("email")
            .value
            .trim();
        const password =
          document
            .getElementById("password")
            .value;
        if (!email || !password) {
          mostrarMensaje(
            "Completá el correo y la contraseña.",
            "error"
          );
          return;
        }
        loginButton.disabled = true;
        loginButton.textContent =
          "Ingresando...";
        mostrarMensaje("", "");
        try {
          const respuesta =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });
          if (respuesta.error) {
            console.error(
              "Error Supabase:",
              respuesta.error
            );
            mostrarMensaje(
              respuesta.error.message,
              "error"
            );
            return;
          }
          if (
            respuesta.data &&
            respuesta.data.session
          ) {
            /*
             * La sesión existe.
             * Mostramos el panel inmediatamente.
             */
            mostrarPanel();
          } else {
            mostrarMensaje(
              "No se pudo crear la sesión.",
              "error"
            );
          }
        } catch (error) {
          console.error(
            "Error inesperado:",
            error
          );
          mostrarMensaje(
            "No se pudo conectar con Supabase.",
            "error"
          );
        } finally {
          loginButton.disabled = false;
          loginButton.textContent =
            "Iniciar sesión";
        }
      }
    );
    /* =====================================
       CERRAR SESIÓN
       ===================================== */
    logoutButton.addEventListener(
      "click",
      async function() {
        logoutButton.disabled = true;
        const respuesta =
          await supabaseClient.auth.signOut();
        logoutButton.disabled = false;
        if (respuesta.error) {
          console.error(
            "Error cerrando sesión:",
            respuesta.error
          );
          return;
        }
        document.getElementById(
          "password"
        ).value = "";
        mostrarMensaje("", "");
        mostrarLogin();
      }
    );
    /* =====================================
       COMPROBAR SESIÓN AL ABRIR
       ===================================== */
    async function comprobarSesionInicial() {
      try {
        const respuesta =
          await supabaseClient.auth.getSession();
        if (
          respuesta.data &&
          respuesta.data.session
        ) {
          mostrarPanel();
        } else {
          mostrarLogin();
        }
      } catch (error) {
        console.error(
          "Error comprobando sesión:",
          error
        );
        mostrarLogin();
      } finally {
        /*
         * Recién acá permitimos iniciar sesión.
         */
        sistemaListo = true;
        loginButton.disabled = false;
      }
    }
    /* =====================================
       CONTADORES
       ===================================== */
    async function cargarContadores() {
      try {
        const reservas =
          await supabaseClient
            .from("reservas")
            .select("*", {
              count: "exact",
              head: true
            });
        const mesas =
          await supabaseClient
            .from("mesas")
            .select("*", {
              count: "exact",
              head: true
            });
        const fotos =
          await supabaseClient
            .from("galeria_fotos")
            .select("*", {
              count: "exact",
              head: true
            });
        if (!reservas.error) {
          document.getElementById(
            "reservasCount"
          ).textContent =
            reservas.count || 0;
        }
        if (!mesas.error) {
          document.getElementById(
            "mesasCount"
          ).textContent =
            mesas.count || 0;
        }
        if (!fotos.error) {
          document.getElementById(
            "fotosCount"
          ).textContent =
            fotos.count || 0;
        }
      } catch (error) {
        console.error(
          "Error cargando contadores:",
          error
        );
      }
    }
    /* =====================================
       INICIAR SISTEMA
       ===================================== */
    comprobarSesionInicial();
  </script>
</body>
</html>
