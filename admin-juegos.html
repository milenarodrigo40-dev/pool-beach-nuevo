<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pool & Beach - Juegos</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#eef8fb;
  margin:0;
  color:#123;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  border-radius:14px;
  padding:18px;
  margin:15px 0;
  box-shadow:0 2px 10px #0001;
}
input,select,textarea,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:6px 0;
  border-radius:9px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  background:#087ea4;
  color:white;
  border:0;
  font-weight:bold;
}
.danger{
  background:#d9534f;
}
#panel{
  display:none;
}
.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:15px;
}
.tabs button{
  width:auto;
  white-space:nowrap;
}
.tab{
  display:none;
}
.tab.active{
  display:block;
}
.msg{
  font-weight:bold;
  min-height:22px;
}
.error{
  color:#c62828;
}
.ok{
  color:#16803c;
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 Pool & Beach</h1>

<div id="login" class="card">

<h2>🔐 Acceso administrador</h2>

<input
id="email"
type="email"
placeholder="Email"
autocomplete="username">

<input
id="password"
type="password"
placeholder="Contraseña"
autocomplete="current-password">

<button id="loginBtn">
Ingresar
</button>

<p id="loginMsg" class="msg"></p>

</div>


<div id="panel">

<div class="card">

<button id="logout" class="danger">
Cerrar sesión
</button>

<h2>
Panel de Juegos, Torneos y Ranking
</h2>

<p id="panelMsg" class="msg"></p>

</div>


<div class="tabs">

<button data-tab="torneos">
🏆 Torneos
</button>

<button data-tab="jugadores">
👤 Jugadores
</button>

<button data-tab="participantes">
👥 Participantes
</button>

<button data-tab="partidas">
🎮 Partidas
</button>

<button data-tab="ranking">
📊 Ranking
</button>

<button data-tab="mesas">
🪑 Mesas
</button>

<button data-tab="promos">
🎁 Promociones
</button>

</div>


<section id="torneos" class="tab active">

<div class="card">

<h3>Crear torneo</h3>

<input id="t_nombre" placeholder="Nombre">

<input id="t_juego" placeholder="Juego">

<input id="t_fecha" type="date">

<input
id="t_inscripcion"
type="number"
placeholder="Inscripción">

<input
id="t_p1"
type="number"
placeholder="Premio 1°">

<input
id="t_p2"
type="number"
placeholder="Premio 2°">

<input
id="t_max"
type="number"
placeholder="Máximo participantes">

<select id="t_estado">

<option value="abierto">
Abierto
</option>

<option value="cerrado">
Cerrado
</option>

</select>

<textarea
id="t_notas"
placeholder="Notas">
</textarea>

<button id="crearTorneo">
Crear torneo
</button>

</div>

<div class="card">

<h3>Torneos</h3>

<div id="listaTorneos"></div>

</div>

</section>


<section id="jugadores" class="tab">

<div class="card">

<h3>Crear jugador</h3>

<input
id="j_nombre"
placeholder="Nombre">

<input
id="j_telefono"
placeholder="Teléfono">

<button id="crearJugador">
Crear jugador
</button>

</div>

<div class="card">

<h3>Jugadores</h3>

<div id="listaJugadores"></div>

</div>

</section>


<section id="participantes" class="tab">

<div class="card">

<h3>Agregar participante</h3>

<select id="p_torneo"></select>

<select id="p_jugador"></select>

<button id="agregarParticipante">
Agregar
</button>

</div>

<div class="card">

<div id="listaParticipantes"></div>

</div>

</section>


<section id="partidas" class="tab">

<div class="card">

<h3>Registrar partida</h3>

<select id="m_mesa"></select>

<select id="m_torneo"></select>

<select id="m_a"></select>

<select id="m_b"></select>

<select id="m_ganador">

<option value="">
Sin ganador
</option>

</select>

<input
id="m_pa"
type="number"
value="0"
placeholder="Puntos jugador A">

<input
id="m_pb"
type="number"
value="0"
placeholder="Puntos jugador B">

<select id="m_estado">

<option value="pendiente">
Pendiente
</option>

<option value="finalizada">
Finalizada
</option>

</select>

<button id="crearPartida">
Crear partida
</button>

</div>

<div class="card">

<div id="listaPartidas"></div>

</div>

</section>


<section id="ranking" class="tab">

<div class="card">

<h3>📊 Ranking</h3>

<div id="listaRanking"></div>

</div>

</section>


<section id="mesas" class="tab">

<div class="card">

<h3>🪑 Mesas</h3>

<div id="listaMesas"></div>

</div>

</section>


<section id="promos" class="tab">

<div class="card">

<h3>🎁 Crear promoción</h3>

<input
id="promo_titulo"
placeholder="Título">

<input
id="promo_precio"
type="number"
placeholder="Precio">

<textarea
id="promo_desc"
placeholder="Descripción">
</textarea>

<button id="crearPromo">
Crear promoción
</button>

</div>

<div class="card">

<div id="listaPromos"></div>

</div>

</section>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://nmpakeovqkdajtswjpgm.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_FyuFdiW_2eXNScLd9MShng_rLxxztsu";

let client = null;

const $ = id =>
document.getElementById(id);


function mostrarMensaje(id,texto,error=false){

$(id).textContent = texto;

$(id).className =
"msg " + (error ? "error" : "ok");

}


function escapar(valor){

return String(valor ?? "")
.replace(/[&<>"']/g,function(c){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[c];

});

}


async function iniciar(){

try{

if(!window.supabase){

throw new Error(
"No se pudo cargar Supabase. Recargá la página."
);

}

client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const {data} =
await client.auth.getSession();

if(data.session){

mostrarPanel();

}

}catch(error){

mostrarMensaje(
"loginMsg",
"❌ " + error.message,
true
);

}

}


async function login(){

const email =
$("email").value.trim();

const password =
$("password").value;

if(!email || !password){

mostrarMensaje(
"loginMsg",
"Completá email y contraseña.",
true
);

return;

}

$("loginBtn").disabled=true;

$("loginBtn").textContent="Ingresando...";


try{

const {error} =
await client.auth.signInWithPassword({

email:email,

password:password

});

if(error){

throw error;

}

mostrarPanel();

}catch(error){

mostrarMensaje(
"loginMsg",
"❌ " + error.message,
true
);

}finally{

$("loginBtn").disabled=false;

$("loginBtn").textContent="Ingresar";

}

}


function mostrarPanel(){

$("login").style.display="none";

$("panel").style.display="block";

cargarTodo();

}


$("loginBtn").addEventListener(
"click",
login
);


$("password").addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

login();

}

});


$("logout").addEventListener(
"click",
async function(){

await client.auth.signOut();

location.reload();

});


document
.querySelectorAll("[data-tab]")
.forEach(function(boton){

boton.addEventListener(
"click",
function(){

document
.querySelectorAll(".tab")
.forEach(function(tab){

tab.classList.remove("active");

});

$(boton.dataset.tab)
.classList.add("active");

});

});


async function cargarTodo(){

await Promise.allSettled([

cargarTorneos(),

cargarJugadores(),

cargarParticipantes(),

cargarPartidas(),

cargarRanking(),

cargarMesas(),

cargarPromos()

]);

await llenarSelects();

}


async function llenarSelects(){

const torneos =
await client
.from("torneos")
.select("id,nombre")
.order("id",{ascending:false});


const jugadores =
await client
.from("jugadores")
.select("id,nombre")
.eq("activo",true)
.order("nombre");


const mesas =
await client
.from("mesas")
.select("id,numero,nombre")
.eq("activa",true)
.order("numero");


$("p_torneo").innerHTML =
(torneos.data || [])
.map(function(x){

return `<option value="${x.id}">
${escapar(x.nombre)}
</option>`;

})
.join("");


$("m_torneo").innerHTML =
'<option value="">Sin torneo</option>' +

(torneos.data || [])
.map(function(x){

return `<option value="${x.id}">
${escapar(x.nombre)}
</option>`;

})
.join("");


const opciones =
(jugadores.data || [])
.map(function(x){

return `<option value="${x.id}">
${escapar(x.nombre)}
</option>`;

})
.join("");


$("p_jugador").innerHTML=opciones;

$("m_a").innerHTML=opciones;

$("m_b").innerHTML=opciones;

$("m_ganador").innerHTML =
'<option value="">Sin ganador</option>' +
opciones;


$("m_mesa").innerHTML =
'<option value="">Sin mesa</option>' +

(mesas.data || [])
.map(function(x){

return `<option value="${x.id}">
Mesa ${x.numero || ""} ${escapar(x.nombre)}
</option>`;

})
.join("");

}


async function cargarTorneos(){

const resultado =
await client
.from("torneos")
.select("*")
.order("fecha",{ascending:false});


if(resultado.error){

$("listaTorneos").textContent =
"Error: " + resultado.error.message;

return;

}


$("listaTorneos").innerHTML =
(resultado.data || [])
.map(function(x){

return `

<div class="card">

<b>${escapar(x.nombre)}</b>

<br>

${escapar(x.juego)}

—

${escapar(x.fecha)}

—

${escapar(x.estado)}

<br>

Inscripción:

$${Number(
x.inscripcion || 0
).toLocaleString("es-AR")}

<br>

<button
class="danger"
onclick="eliminarTorneo(${x.id})">

Eliminar

</button>

</div>

`;

})
.join("") || "No hay torneos.";

}


$("crearTorneo").onclick =
async function(){

const datos={

nombre:$("t_nombre").value.trim(),

juego:$("t_juego").value.trim(),

fecha:$("t_fecha").value,

inscripcion:Number(
$("t_inscripcion").value || 0
),

premio_primero:Number(
$("t_p1").value || 0
),

premio_segundo:Number(
$("t_p2").value || 0
),

max_participantes:
$("t_max").value
? Number($("t_max").value)
: null,

estado:$("t_estado").value,

notas:$("t_notas").value.trim()

};


const {error} =
await client
.from("torneos")
.insert(datos);


if(error){

alert(error.message);

}else{

alert("Torneo creado");

cargarTorneos();

llenarSelects();

}

};


window.eliminarTorneo =
async function(id){

if(!confirm("¿Eliminar torneo?"))
return;

const {error} =
await client
.from("torneos")
.delete()
.eq("id",id);


if(error){

alert(error.message);

}else{

cargarTorneos();

llenarSelects();

}

};


async function cargarJugadores(){

const resultado =
await client
.from("jugadores")
.select("*")
.order("nombre");


if(resultado.error){

$("listaJugadores").textContent =
"Error: " + resultado.error.message;

return;

}


$("listaJugadores").innerHTML =
(resultado.data || [])
.map(function(x){

return `

<div>

${escapar(x.nombre)}

${x.telefono
? " — " + escapar(x.telefono)
: ""}

<button
class="danger"
onclick="eliminarJugador(${x.id})">

Eliminar

</button>

</div>

`;

})
.join("") || "No hay jugadores.";

}


$("crearJugador").onclick =
async function(){

const nombre =
$("j_nombre").value.trim();


if(!nombre){

alert("Escribí el nombre");

return;

}


const {error} =
await client
.from("jugadores")
.insert({

nombre:nombre,

telefono:
$("j_telefono").value.trim()

});


if(error){

alert(error.message);

}else{

cargarJugadores();

llenarSelects();

$("j_nombre").value="";

$("j_telefono").value="";

}

};


window.eliminarJugador =
async function(id){

if(!confirm("¿Eliminar jugador?"))
return;

const {error} =
await client
.from("jugadores")
.delete()
.eq("id",id);


if(error){

alert(error.message);

}else{

cargarJugadores();

llenarSelects();

}

};


async function cargarParticipantes(){

const resultado =
await client
.from("participantes_torneo")
.select(
"id,puntos,posicion,torneo_id,jugador_id"
)
.order("puntos",{ascending:false});


if(resultado.error){

$("listaParticipantes").textContent =
"Error: " + resultado.error.message;

return;

}


const torneos =
await client
.from("torneos")
.select("id,nombre");


const jugadores =
await client
.from("jugadores")
.select("id,nombre");


const nombresTorneo =
Object.fromEntries(
(torneos.data || [])
.map(x=>[x.id,x.nombre])
);


const nombresJugador =
Object.fromEntries(
(jugadores.data || [])
.map(x=>[x.id,x.nombre])
);


$("listaParticipantes").innerHTML =
(resultado.data || [])
.map(function(x){

return `

<div>

${escapar(nombresTorneo[x.torneo_id])}

—

${escapar(nombresJugador[x.jugador_id])}

—

${x.puntos} puntos

<button
class="danger"
onclick="eliminarParticipante(${x.id})">

Eliminar

</button>

</div>

`;

})
.join("") || "No hay participantes.";

}


$("agregarParticipante").onclick =
async function(){

const {error} =
await client
.from("participantes_torneo")
.insert({

torneo_id:
Number($("p_torneo").value),

jugador_id:
Number($("p_jugador").value)

});


if(error){

alert(error.message);

}else{

cargarParticipantes();

cargarRanking();

}

};


window.eliminarParticipante =
async function(id){

if(!confirm("¿Eliminar participante?"))
return;

const {error} =
await client
.from("participantes_torneo")
.delete()
.eq("id",id);


if(error){

alert(error.message);

}else{

cargarParticipantes();

cargarRanking();

}

};


async function cargarPartidas(){

const resultado =
await client
.from("partidas")
.select(
"id,mesa_id,torneo_id,jugador_a_id,jugador_b_id,ganador_id,puntos_a,puntos_b,estado,created_at"
)
.order("created_at",{ascending:false});


if(resultado.error){

$("listaPartidas").textContent =
"Error: " + resultado.error.message;

return;

}


const jugadores =
await client
.from("jugadores")
.select("id,nombre");


const nombres =
Object.fromEntries(
(jugadores.data || [])
.map(x=>[x.id,x.nombre])
);


$("listaPartidas").innerHTML =
(resultado.data || [])
.map(function(x){

return `

<div>

${escapar(nombres[x.jugador_a_id])}

${x.puntos_a}

vs

${x.puntos_b}

${escapar(nombres[x.jugador_b_id])}

—

${escapar(x.estado)}

</div>

`;

})
.join("") || "No hay partidas.";

}


$("crearPartida").onclick =
async function(){

const datos={

mesa_id:
$("m_mesa").value
? Number($("m_mesa").value)
: null,

torneo_id:
$("m_torneo").value
? Number($("m_torneo").value)
: null,

jugador_a_id:
Number($("m_a").value),

jugador_b_id:
Number($("m_b").value),

ganador_id:
$("m_ganador").value
? Number($("m_ganador").value)
: null,

puntos_a:
Number($("m_pa").value || 0),

puntos_b:
Number($("m_pb").value || 0),

estado:
$("m_estado").value

};


const {error} =
await client
.from("partidas")
.insert(datos);


if(error){

alert(error.message);

}else{

alert("Partida guardada");

cargarPartidas();

}

};


async function cargarRanking(){

const resultado =
await client
.from("participantes_torneo")
.select("jugador_id,puntos")
.order("puntos",{ascending:false});


if(resultado.error){

$("listaRanking").textContent =
"Error: " + resultado.error.message;

return;

}


const jugadores =
await client
.from("jugadores")
.select("id,nombre");


const nombres =
Object.fromEntries(
(jugadores.data || [])
.map(x=>[x.id,x.nombre])
);


$("listaRanking").innerHTML =
(resultado.data || [])
.map(function(x,i){

return `

<div>

<b>${i+1}.</b>

${escapar(nombres[x.jugador_id])}

—

${x.puntos} puntos

</div>

`;

})
.join("") || "No hay ranking.";

}


async function cargarMesas(){

const resultado =
await client
.from("mesas")
.select("*")
.order("numero");


if(resultado.error){

$("listaMesas").textContent =
"Error: " + resultado.error.message;

return;

}


$("listaMesas").innerHTML =
(resultado.data || [])
.map(function(x){

return `

<div>

Mesa ${x.numero || ""}

—

${escapar(x.nombre || "")}

—

${x.activa ? "Activa" : "Inactiva"}

</div>

`;

})
.join("") || "No hay mesas.";

}


async function cargarPromos(){

const resultado =
await client
.from("promociones")
.select("*")
.order("created_at",{ascending:false});


if(resultado.error){

$("listaPromos").textContent =
"Error: " + resultado.error.message;

return;

}


$("listaPromos").innerHTML =
(resultado.data || [])
.map(function(x){

return `

<div>

<b>${escapar(x.titulo)}</b>

—

$${Number(
x.precio || 0
).toLocaleString("es-AR")}

—

${escapar(x.descripcion || "")}

<button
class="danger"
onclick="eliminarPromo(${x.id})">

Eliminar

</button>

</div>

`;

})
.join("") || "No hay promociones.";

}


$("crearPromo").onclick =
async function(){

const titulo =
$("promo_titulo").value.trim();


if(!titulo){

alert("Escribí un título");

return;

}


const {error} =
await client
.from("promociones")
.insert({

titulo:titulo,

precio:Number(
$("promo_precio").value || 0
),

descripcion:
$("promo_desc").value.trim()

});


if(error){

alert(error.message);

}else{

cargarPromos();

$("promo_titulo").value="";

$("promo_precio").value="";

$("promo_desc
