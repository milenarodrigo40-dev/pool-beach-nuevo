<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool & Beach</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        linear-gradient(rgba(0, 120, 160, 0.35), rgba(0, 0, 0, 0.45)),
        linear-gradient(180deg, #13b5d1 0%, #f3d29b 100%);
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 45px 25px;
      text-align: center;
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.42);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .location {
      display: inline-block;
      padding: 9px 16px;
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(48px, 11vw, 90px);
      font-weight: 900;
    }

    p {
      font-size: 20px;
      line-height: 1.5;
    }

    .games {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 28px 0;
    }

    .game {
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.16);
    }

    footer {
      margin-top: 30px;
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <main>
    <section class="card">

      <div class="location">
        PUERTO PIRÁMIDES
      </div>

      <h1>Pool & Beach</h1>

      <p>
        Un lugar para disfrutar, jugar, comer y pasarla bien.
      </p>

      <div class="games">
        <div class="game">🎱 Pool</div>
        <div class="game">🎮 PlayStation</div>
        <div class="game">🎲 Juegos</div>
        <div class="game">🏖️ Beach</div>
      </div>

      <p>
        Promociones, menú, reservas y toda la información de Pool & Beach.
      </p>

      <footer>
        Pool & Beach · Puerto Pirámides
      </footer>

    </section>
  </main>

</body>
</html>
