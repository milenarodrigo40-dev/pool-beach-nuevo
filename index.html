<script>
async function loadTableOptions(){

  const result =
    await db
      .from('tables_pool')
      .select('id,table_number,name,active')
      .eq('active',true)
      .order('table_number');

  if(result.error){
    console.error('Error cargando mesas:', result.error);
    return;
  }

  const tables =
    result.data || [];

  /* =========================
     MESAS
     ========================= */

  [
    'duelTable',
    'triviaTable'
  ].forEach(id=>{

    const select = $(id);

    if(!select) return;

    select.innerHTML =
      tables.map(table=>`

        <option value="${esc(table.id)}">
          Mesa ${esc(table.table_number)}
          ${table.name ? ' · '+esc(table.name) : ''}
        </option>

      `).join('');

  });


  /* =========================
     JUEGOS PARA DUELO
     ========================= */

  const gamesResult =
    await db
      .from('games')
      .select('id,name,description,active')
      .eq('active',true)
      .order('name');

  if(gamesResult.error){

    console.error(
      'Error cargando juegos para Duelo:',
      gamesResult.error
    );

    const duelGame = $('duelGame');

    if(duelGame){
      duelGame.innerHTML =
        '<option value="">No se pudieron cargar los juegos</option>';
    }

    return;
  }

  const games =
    gamesResult.data || [];

  const duelGame =
    $('duelGame');

  if(duelGame){

    duelGame.innerHTML =
      games.map(game=>`

        <option value="${esc(game.id)}">
          ${esc(game.name)}
        </option>

      `).join('') ||

      '<option value="">No hay juegos disponibles</option>';

  }
}
</script>
