<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi Tarjeta | Pool & Beach</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(0, 170, 255, 0.20), transparent 35%),
        linear-gradient(180deg, #06121d 0%, #031018 100%);
      color: white;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .volver {
      display: inline-block;
      color: #9edcff;
      text-decoration: none;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .volver:hover {
      text-decoration: underline;
    }

    .tarjeta {
      background: rgba(9, 29, 43, 0.94);
      border: 1px solid rgba(112, 210, 255, 0.30);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 15px 45px rgba(0,0,0,.40);
    }

    .marca {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #9edcff;
      margin-bottom: 25px;
    }

    .busqueda {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #31566c;
      background: #071923;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #58c9ff;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      background: #20aeea;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.1);
    }

    .estado {
      display: none;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }

    .estado.error {
      display: block;
      background: rgba(220, 50, 50, .15);
      border: 1px solid rgba(255, 80, 80, .35);
      color: #ffb0b0;
    }

    .estado.ok {
      display: block;
      background: rgba(50, 200, 120, .12);
      border: 1px solid rgba(50, 200, 120, .30);
      color: #9affc7;
    }

    .perfil {
      display: none;
    }

    .nombre {
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .numero {
      color: #8cb7ca;
      margin-bottom: 20px;
    }

    .estado-activo {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(45, 210, 120, .15);
      color: #8ff5ba;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .estado-inactivo {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 80, 80, .15);
      color: #ffabab;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .datos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    .dato {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 18px;
    }

    .dato span {
      display: block;
      color: #88a7b7;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .dato strong {
      font-size: 25px;
    }

    .historial-titulo {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .historial {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .movimiento {
      padding: 15px;
      border-radius: 14px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);
    }

    .movimiento-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .concepto {
      font-weight: bold;
    }

    .fecha {
      color: #7796a6;
      font-size: 12px;
      margin-top: 7px;
    }

    .puntos {
      font-weight: 900;
      white-space: nowrap;
    }

    .sin-historial {
      color: #8ca5b2;
      padding: 15px 0;
    }

    .cargando {
      text-align: center;
      color: #8cb7ca;
      padding: 20px;
    }

    @media (max-width: 430px) {
      .busqueda {
        flex-direction: column;
      }

      .busqueda button {
        width: 100%;
      }

      .datos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <a class="volver" href="index.html">← Volver a Pool & Beach</a>

    <div class="tarjeta">

      <div class="marca">POOL & BEACH</div>
      <div class="subtitulo">Mi tarjeta de cliente</div>

      <div class="busqueda">
        <input
          id="numeroTarjeta"
          type="text"
          placeholder="Ingresá tu número de tarjeta"
          autocomplete="off"
        >

        <button onclick="buscarTarjeta()">
          Consultar
        </button>
      </div>

      <div id="estado" class="estado"></div>

      <div id="cargando" class="cargando" style="display:none;">
        Consultando tarjeta...
      </div>

      <div id="perfil" class="perfil">

        <div id="nombre" class="nombre"></div>

        <div id="numero" class="numero"></div>

        <div id="estadoCliente"></div>

        <div class="datos">

          <div class="dato">
            <span>Puntos</span>
            <strong id="puntos">0</strong>
          </div>

          <div class="dato">
            <span>Saldo</span>
            <strong id="saldo">$0</strong>
          </div>

        </div>

        <div class="historial-titulo">
          Historial
        </div>

        <div id="historial" class="historial">
        </div>

      </div>

    </div>

  </div>

<script>
  const SUPABASE_URL =
    "https://nmpakeovqkdajtswjpgm.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_FyuFdiW_2eXNScLd9MShng_rLxxztsu";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  function escaparHTML(texto) {
    return String(texto ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function mostrarEstado(mensaje, tipo) {
    const elemento = document.getElementById("estado");

    elemento.textContent = mensaje;
    elemento.className = "estado " + tipo;
  }

  function ocultarEstado() {
    const elemento = document.getElementById("estado");

    elemento.textContent = "";
    elemento.className = "estado";
  }

  function formatearSaldo(valor) {
    const numero = Number(valor || 0);

    return numero.toLocaleString("es-AR", {
      style: "currency",
      currency: "ARS",
      maximumFractionDigits: 0
    });
  }

  function formatearFecha(fecha) {
    if (!fecha) return "";

    const date = new Date(fecha);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleString("es-AR", {
      dateStyle: "short",
      timeStyle: "short"
    });
  }

  async function buscarTarjeta() {

    const input = document.getElementById("numeroTarjeta");

    const numero = input.value.trim();

    if (!numero) {
      mostrarEstado(
        "Ingresá el número de tu tarjeta.",
        "error"
      );

      document.getElementById("perfil").style.display = "none";

      return;
    }

    ocultarEstado();

    document.getElementById("perfil").style.display = "none";

    document.getElementById("cargando").style.display = "block";

    try {

      const { data, error } =
        await supabaseClient.rpc(
          "obtener_tarjeta_cliente",
          {
            p_numero: numero
          }
        );

      if (error) {
        throw error;
      }

      if (!data || data.length === 0) {

        mostrarEstado(
          "No encontramos una tarjeta con ese número.",
          "error"
        );

        return;
      }

      const cliente = data[0];

      document.getElementById("nombre").textContent =
        cliente.nombre || "Cliente";

      document.getElementById("numero").textContent =
        "Tarjeta: " + (cliente.numero_tarjeta || numero);

      document.getElementById("puntos").textContent =
        Number(cliente.puntos || 0).toLocaleString("es-AR");

      document.getElementById("saldo").textContent =
        formatearSaldo(cliente.saldo);

      const estadoCliente =
        document.getElementById("estadoCliente");

      if (cliente.activo === false) {

        estadoCliente.textContent =
          "Tarjeta inactiva";

        estadoCliente.className =
          "estado-inactivo";

      } else {

        estadoCliente.textContent =
          "Tarjeta activa";

        estadoCliente.className =
          "estado-activo";
      }

      document.getElementById("perfil").style.display =
        "block";

      await cargarHistorial(numero);

    } catch (error) {

      console.error(error);

      mostrarEstado(
        "No se pudo consultar la tarjeta. Intentá nuevamente.",
        "error"
      );

    } finally {

      document.getElementById("cargando").style.display =
        "none";
    }
  }

  async function cargarHistorial(numero) {

    const contenedor =
      document.getElementById("historial");

    contenedor.innerHTML =
      '<div class="cargando">Cargando historial...</div>';

    try {

      const { data, error } =
        await supabaseClient.rpc(
          "obtener_historial_tarjeta",
          {
            p_numero: numero
          }
        );

      if (error) {
        throw error;
      }

      if (!data || data.length === 0) {

        contenedor.innerHTML =
          '<div class="sin-historial">Todavía no hay movimientos registrados.</div>';

        return;
      }

      contenedor.innerHTML = "";

      data.forEach(function(movimiento) {

        const item =
          document.createElement("div");

        item.className = "movimiento";

        const concepto =
          movimiento.concepto ||
          movimiento.tipo ||
          "Movimiento";

        const cantidad =
          Number(movimiento.cantidad || 0);

        const puntos =
          Number(movimiento.puntos || 0);

        let textoPuntos = "";

        if (puntos > 0) {
          textoPuntos = "+" + puntos + " puntos";
        } else if (puntos < 0) {
          textoPuntos = puntos + " puntos";
        }

        item.innerHTML = `
          <div class="movimiento-top">

            <div class="concepto">
              ${escaparHTML(concepto)}
            </div>

            <div class="puntos">
              ${escaparHTML(textoPuntos)}
            </div>

          </div>

          ${
            cantidad !== 0
              ? `<div style="margin-top:7px;">
                   ${escaparHTML(formatearSaldo(cantidad))}
                 </div>`
              : ""
          }

          <div class="fecha">
            ${escaparHTML(
              formatearFecha(movimiento.creado_en)
            )}
          </div>
        `;

        contenedor.appendChild(item);
      });

    } catch (error) {

      console.error(error);

      contenedor.innerHTML =
        '<div class="sin-historial">No se pudo cargar el historial.</div>';
    }
  }

  document
    .getElementById("numeroTarjeta")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        buscarTarjeta();
      }

    });

  const parametros =
    new URLSearchParams(window.location.search);

  const numeroURL =
    parametros.get("numero");

  if (numeroURL) {

    document.getElementById("numeroTarjeta").value =
      numeroURL;

    buscarTarjeta();
  }
</script>

</body>
</html>
